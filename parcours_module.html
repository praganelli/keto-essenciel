  q:[["Un plateau de poids signifie…",["Que tout est perdu","Une adaptation normale du corps","Qu'il faut manger plus de sucre"],1,"Le corps s'adapte et se recompose : le plateau fait partie du voyage."],
     ["Quel levier aide à relancer la perte de poids ?",["Espacer les repas et arrêter le grignotage","Grignoter davantage","Supprimer le sommeil"],0,"Moins de prises alimentaires = insuline plus basse = déstockage facilité."]]},
 {t:"Le métabolisme",p:[
  ["Pourquoi les régimes classiques échouent","Les régimes hypocaloriques classiques affament le corps : il se défend en ralentissant le métabolisme (moins d'énergie brûlée au repos) et en augmentant la faim. D'où l'effet yo-yo.\nLe keto fonctionne différemment : on mange à satiété, le corps carbure aux graisses (les vôtres incluses !), le métabolisme est préservé et la faim diminue naturellement."],
  ["Protéger son métabolisme","• Mangez suffisamment de protéines (elles protègent le muscle, qui brûle des calories même au repos).\n• Ne descendez pas trop bas en calories trop longtemps.\n• Faites du renforcement musculaire (Module 8) : chaque kilo de muscle gagné augmente vos dépenses au repos.\n• Dormez 7-8 h : le métabolisme se régule la nuit."]],
  q:[["Pourquoi les régimes très restrictifs provoquent-ils l'effet yo-yo ?",["Le métabolisme ralentit et la faim augmente","Ils marchent trop bien","La balance se casse"],0,"Le corps se défend contre la famine : moins de dépenses, plus de faim → reprise."],
     ["Qu'est-ce qui protège le métabolisme ?",["Le muscle et les protéines","Le sucre","Les sodas light"],0,"Le muscle brûle des calories même au repos : protéines + renforcement le préservent."]]},
 {t:"La gestion des écarts",p:[
  ["L'écart n'est pas une catastrophe","Un repas de fête, une part de gâteau d'anniversaire : ça arrive, et ce n'est pas grave.\nLa règle des 3 R :\n1️⃣ Ne pas Ruminer : la culpabilité pousse à enchaîner les écarts.\n2️⃣ Reprendre immédiatement le cap au repas suivant (pas « lundi prochain »).\n3️⃣ Rebooster : une marche, un grand verre d'eau, un bon dîner keto."],
  ["Anticiper les occasions","• Avant un repas de fête : mangez normalement avant (arriver affamé = catastrophe assurée).\n• Sur place : privilégiez viandes, poissons, fromages, légumes ; limitez pain et desserts ; l'eau gazeuse est votre alliée.\n• Après : surveillez votre glycémie, elle vous dira tout — et reprenez simplement vos habitudes.\nUn écart sur 20 repas ne change rien. C'est la routine qui fait le résultat."]],
  q:[["Après un écart, la meilleure attitude est…",["Culpabiliser toute la semaine","Reprendre le cap dès le repas suivant","Abandonner le keto"],1,"Un écart isolé ne change rien : c'est la régularité qui compte."],
     ["Avant un repas de fête, il vaut mieux…",["Arriver affamé","Manger normalement avant","Jeûner 3 jours"],1,"Arriver affamé garantit les excès : mangez normalement avant l'événement."]]}
]},
{t:"Comprendre ses analyses",e:"🔬",d:"Lisez vos prises de sang comme un pro.",ch:[
 {t:"HbA1c et glycémie",p:[
  ["Les deux mesures du sucre","• Glycémie à jeun : photo instantanée. Normale < 1,00 g/L ; prédiabète 1,00-1,25 ; diabète ≥ 1,26 g/L (à deux reprises).\n• HbA1c : le film des 3 derniers mois (voir Module 1). C'est elle qui guide votre médecin.\nEn suivant les deux dans l'onglet Suivi, vous verrez vos progrès noir sur blanc : la glycémie réagit en jours, l'HbA1c en mois."],
  ["Interpréter vos progrès","Une HbA1c qui passe de 8 % à 7 % = une glycémie moyenne qui a baissé de ~0,3 g/L = un risque de complications nettement réduit. Chaque dixième compte !\nAstuce : demandez toujours une copie de vos analyses et notez les valeurs clés. Vous êtes l'acteur principal de votre suivi."]],
  q:[["Un diabète est défini par une glycémie à jeun ≥…",["0,80 g/L","1,26 g/L","3 g/L"],1,"≥ 1,26 g/L à deux reprises : c'est le seuil diagnostique du diabète."],
     ["L'HbA1c réagit aux changements en…",["Quelques heures","Quelques mois","10 ans"],1,"Elle reflète 3 mois de glycémies : soyez patient, elle suivra vos efforts."]]},
 {t:"Le bilan lipidique : triglycérides, HDL, LDL",p:[
  ["Triglycérides et HDL, vos vrais indicateurs","• Triglycérides : graisses circulantes fabriquées surtout… à partir des sucres. Objectif < 1,50 g/L. Le keto les fait souvent chuter rapidement.\n• HDL (« bon cholestérol ») : nettoie les artères. Plus il est haut, mieux c'est (> 0,40 g/L homme, > 0,50 femme). Il monte avec le keto et l'exercice.\n• Le rapport triglycérides/HDL est un excellent marqueur de résistance à l'insuline : visez < 2."],
  ["Le LDL, à nuancer","Le LDL (« mauvais cholestérol ») peut augmenter légèrement en keto chez certaines personnes. Ce chiffre seul ne suffit pas : ce qui compte, c'est le tableau complet (triglycérides bas + HDL haut = particules LDL grosses et peu dangereuses).\nDiscutez-en avec votre médecin, qui jugera selon votre risque cardiovasculaire global. Ne modifiez jamais un traitement hypolipémiant seul."]],
  q:[["Les triglycérides sont surtout fabriqués à partir…",["Des sucres","Du gras de l'avocat","De l'eau"],0,"C'est pourquoi ils chutent souvent spectaculairement en alimentation pauvre en glucides."],
     ["Quel rapport reflète bien la résistance à l'insuline ?",["Triglycérides / HDL","Poids / taille des pieds","LDL / âge"],0,"Un rapport triglycérides/HDL < 2 est un excellent signe métabolique."]]},
 {t:"Insuline et HOMA",p:[
  ["L'insulinémie à jeun","Mesurer l'insuline à jeun révèle ce que la glycémie cache : un pancréas qui surproduit pour compenser la résistance.\nUne glycémie normale AVEC une insuline élevée = résistance à l'insuline déjà installée, des années avant le diabète.\nValeur souhaitable : généralement < 10 µUI/mL à jeun (repères variables selon les laboratoires)."],
  ["L'indice HOMA","Le HOMA-IR combine glycémie et insuline à jeun pour chiffrer la résistance à l'insuline :\nHOMA = (glycémie [mmol/L] × insuline [µUI/mL]) / 22,5.\n• < 2 : sensibilité correcte.\n• 2 à 3 : résistance débutante.\n• > 3 : résistance installée.\nC'est un excellent marqueur de suivi : il s'améliore souvent en quelques mois de keto."]],
  q:[["Une insuline à jeun élevée avec une glycémie normale signifie…",["Tout va bien","Une résistance à l'insuline déjà installée","Un excès de sport"],1,"Le pancréas surproduit pour compenser : c'est le stade silencieux avant le diabète."],
     ["Un HOMA-IR > 3 indique…",["Une résistance à l'insuline installée","Une hydratation parfaite","Un manque de sel"],0,"Au-delà de 3, la résistance à l'insuline est franche — et réversible avec le mode de vie."]]},
 {t:"CRP et inflammation",p:[
  ["L'inflammation chronique","La CRP (protéine C-réactive) mesure l'inflammation. La version « ultrasensible » (CRP-us) détecte l'inflammation chronique de bas grade — celle qui accompagne surpoids, diabète et risque cardiovasculaire.\nRepères CRP-us : < 1 mg/L excellent ; 1-3 moyen ; > 3 risque augmenté."],
  ["Comment la faire baisser","L'inflammation chronique diminue avec :\n• la baisse du sucre et des produits ultra-transformés ;\n• la perte de graisse viscérale ;\n• les oméga-3 (poissons gras 2-3 fois/semaine) ;\n• le sommeil et la gestion du stress ;\n• l'activité physique régulière (modérée).\nAutrement dit : tout ce parcours travaille pour votre CRP."]],
  q:[["Que mesure la CRP ultrasensible ?",["L'inflammation chronique de bas grade","La quantité de fer","Le taux de vitamine C"],0,"La CRP-us révèle l'inflammation silencieuse liée au surpoids et au diabète."],
     ["Qu'est-ce qui fait baisser l'inflammation chronique ?",["Moins de sucre, plus d'oméga-3, sommeil et activité","Plus de sodas","Veiller toute la nuit"],0,"Alimentation, sommeil, mouvement : les piliers anti-inflammatoires."]]},
 {t:"Foie et reins : ASAT, ALAT, créatinine",p:[
  ["Les enzymes du foie","ASAT, ALAT et GGT sont les enzymes hépatiques. Élevées, elles signalent souvent un foie gras (stéatose) — présent chez la majorité des diabétiques de type 2.\nLa cause n°1 : le sucre et surtout le fructose (sodas, jus), que le foie transforme en graisse.\nEn keto, les enzymes hépatiques s'améliorent souvent en 2 à 6 mois : le foie se dégraisse."],
  ["La créatinine et les reins","La créatinine évalue la fonction rénale (avec le DFG, débit de filtration). Le diabète mal équilibré est la première cause d'insuffisance rénale : ce suivi est crucial.\nÀ savoir : une alimentation riche en protéines n'abîme PAS des reins sains, mais en cas de maladie rénale existante, l'apport en protéines doit être ajusté avec le médecin.\nSurveillez aussi la microalbuminurie (urines) : elle détecte très tôt une souffrance rénale."]],
  q:[["Quelle est la cause n°1 du foie gras ?",["Le sucre et le fructose","Les épinards","L'eau minérale"],0,"Le foie transforme l'excès de sucre — surtout le fructose — en graisse."],
     ["Pourquoi surveiller la créatinine quand on est diabétique ?",["Le diabète est la 1ère cause d'insuffisance rénale","Pour connaître son groupe sanguin","Par curiosité"],0,"Le suivi rénal (créatinine, DFG, microalbuminurie) est essentiel dans le diabète."]]}
]},
{t:"Activité physique",e:"🏃",d:"Bouger : le médicament gratuit le plus puissant.",ch:[
 {t:"Pourquoi bouger",p:[
  ["Le muscle, éponge à glucose","Quand un muscle travaille, il aspire le glucose du sang — même sans insuline ! C'est le seul moment où vos cellules ouvrent leurs portes sans clé.\nRésultat immédiat : 15 minutes d'activité peuvent faire baisser la glycémie de 0,2 à 0,5 g/L.\nRésultat durable : des muscles entraînés restent sensibles à l'insuline 24 à 48 h après l'effort."],
  ["Pas besoin d'être un athlète","L'objectif n'est pas le marathon : c'est la régularité.\n• 30 minutes de marche par jour réduisent déjà l'HbA1c.\n• Fractionnez si besoin : 3 × 10 minutes comptent autant.\n• Le meilleur sport est celui que vous ferez encore dans 6 mois.\n⚠️ Si vous êtes sous insuline ou sulfamides : gardez de quoi vous resucrer sur vous et parlez de votre programme à votre médecin."]],
  q:[["Que fait un muscle qui travaille ?",["Il aspire le glucose du sang, même sans insuline","Il fabrique du sucre","Rien"],0,"L'exercice ouvre les portes des cellules sans avoir besoin de la clé insuline."],
     ["Combien de temps dure l'effet sensibilisant de l'exercice ?",["5 minutes","24 à 48 heures","1 an"],1,"Un muscle entraîné reste plus sensible à l'insuline 1 à 2 jours : d'où la régularité."]]},
 {t:"La marche",p:[
  ["L'arme secrète des glycémies","La marche est le traitement le plus sous-estimé du diabète :\n• 10 minutes de marche APRÈS chaque repas réduisent le pic de glycémie de 20 à 30 %.\n• C'est le moment le plus rentable : le glucose du repas part directement dans les muscles.\nCommencez dès aujourd'hui : le tour du pâté de maisons après le dîner."],
  ["Progresser en douceur","• Semaine 1-2 : 10 min après le repas principal.\n• Semaine 3-4 : 10 min après 2 repas, ou 20 min d'affilée.\n• Objectif : 7 000 à 10 000 pas par jour (suivez-les dans l'onglet Suivi !).\nAstuces : descendre un arrêt plus tôt, garer la voiture plus loin, téléphoner en marchant, prendre les escaliers. Tout compte."]],
  q:[["Quel est le meilleur moment pour marcher ?",["Juste après les repas","Jamais","Uniquement à minuit"],0,"10 minutes après le repas réduisent le pic glycémique de 20 à 30 %."],
     ["Quel objectif de pas quotidien viser ?",["500 pas","7 000 à 10 000 pas","50 000 pas"],1,"7 000-10 000 pas/jour : un objectif réaliste aux bénéfices prouvés."]]},
 {t:"Le renforcement musculaire",p:[
  ["Plus de muscle = moins de diabète","Le muscle est votre plus grand réservoir à glucose. Plus vous en avez, plus votre corps absorbe le sucre facilement — même au repos.\nAprès 40 ans, on perd naturellement du muscle chaque année : le renforcement n'est pas une option, c'est une assurance santé.\n2 séances de 20-30 minutes par semaine suffisent pour des résultats mesurables."],
  ["Par où commencer","Programme débutant à la maison, sans matériel :\n• Squats sur chaise (s'asseoir-se lever) : 3 × 10.\n• Pompes contre un mur : 3 × 10.\n• Ponts fessiers allongé : 3 × 12.\n• Montées de genoux debout : 3 × 20.\nReposez-vous 1 minute entre les séries. L'onglet Muscu de l'application vous propose des programmes détaillés par niveau."]],
  q:[["Pourquoi le muscle aide-t-il contre le diabète ?",["C'est le plus grand réservoir à glucose du corps","Il pèse lourd","Il n'aide pas"],0,"Plus de masse musculaire = plus de capacité à absorber le glucose sanguin."],
     ["Combien de séances de renforcement par semaine suffisent ?",["2 séances de 20-30 min","7 séances de 2 h","Aucune"],0,"Deux séances hebdomadaires produisent déjà des effets mesurables sur la glycémie."]]},
 {t:"Le gainage",p:[
  ["Un tronc solide","Le gainage renforce les muscles profonds du tronc : abdominaux, dos, lombaires.\nBénéfices : meilleure posture, moins de mal de dos, ventre plus plat, et une base solide pour toutes les autres activités.\nBonus : les grands groupes musculaires sollicités consomment du glucose, comme tout effort musculaire."],
  ["Les exercices de base","• Planche sur les avant-bras : tenez 20 secondes, dos droit (ni creusé ni bombé). Progressez vers 60 s.\n• Planche latérale : 15 s de chaque côté.\n• Superman allongé sur le ventre : levez bras et jambes 3 × 10.\nSi la planche est trop dure : commencez sur les genoux. La qualité (alignement) prime toujours sur la durée."]],
  q:[["Le gainage renforce principalement…",["Les muscles profonds du tronc","Les cheveux","Les ongles"],0,"Abdos profonds, dos, lombaires : la base d'un corps fonctionnel."],
     ["En planche, que faut-il privilégier ?",["La durée à tout prix","La qualité de l'alignement","Regarder la télé"],1,"Un dos bien aligné 20 secondes vaut mieux qu'une minute en mauvaise posture."]]},
 {t:"Les étirements",p:[
  ["Souplesse et récupération","Les étirements entretiennent la mobilité, diminuent les tensions et favorisent la récupération et la détente (utile aussi pour le stress — Module 9 !).\nLe meilleur moment : après l'effort ou le soir, quand les muscles sont chauds. Jamais d'étirement violent à froid."],
  ["La routine de 5 minutes","À faire chaque soir :\n• Nuque : inclinez doucement la tête de chaque côté, 20 s.\n• Épaules : roulez-les lentement 10 fois.\n• Dos : assis, tournez doucement le buste de chaque côté, 20 s.\n• Ischio-jambiers : debout, penchez-vous vers l'avant jambes légèrement fléchies, 30 s.\n• Respirez profondément pendant chaque étirement — cette routine prépare aussi un meilleur sommeil."]],
  q:[["Quel est le meilleur moment pour s'étirer ?",["À froid, brutalement","Après l'effort ou le soir, muscles chauds","Jamais"],1,"Muscles chauds + gestes doux = étirements efficaces et sans risque."],
     ["Que faut-il faire pendant un étirement ?",["Bloquer sa respiration","Respirer profondément","Sautiller"],1,"La respiration profonde amplifie la détente musculaire et nerveuse."]]}
]},
{t:"Stress et sommeil",e:"😴",d:"Deux leviers invisibles qui pilotent votre glycémie.",ch:[
 {t:"Pourquoi le cortisol augmente la glycémie",p:[
  ["L'hormone du stress","Face à un danger, le corps libère du cortisol, qui ordonne au foie de déverser du glucose dans le sang : c'est le carburant pour « fuir ou combattre ».\nProblème : nos stress modernes (travail, écrans, soucis) sont permanents… mais on ne fuit ni ne combat. Le glucose libéré reste dans le sang.\nUn stress chronique peut élever la glycémie autant qu'un repas sucré — sans rien manger !"],
  ["Le stress se gère comme un nutriment","Vous surveillez vos glucides ? Surveillez aussi votre dose de stress quotidienne.\nSignes de cortisol chroniquement élevé : glycémie à jeun haute inexpliquée, ventre qui résiste, sommeil léger, envies de sucre le soir, irritabilité.\nLes chapitres suivants vous donnent des outils concrets, simples et prouvés : respiration, relaxation, cohérence cardiaque."]],
  q:[["Que fait le cortisol sur la glycémie ?",["Il la fait monter (le foie libère du glucose)","Il la fait disparaître","Rien"],0,"Le cortisol prépare le corps à l'action en libérant du glucose — même sans manger."],
     ["Un stress chronique peut-il élever la glycémie à jeun ?",["Oui","Non, impossible","Seulement le week-end"],0,"Le stress permanent maintient le cortisol haut : glycémies à jeun inexpliquées en vue."]]},
 {t:"La respiration",p:[
  ["Le frein de secours du système nerveux","La respiration est le seul levier direct et immédiat sur votre système nerveux : expirer lentement active le mode « repos-digestion » et fait chuter le cortisol en quelques minutes.\nC'est gratuit, invisible, et utilisable partout : avant une réunion, dans les bouchons, avant une prise de sang."],
  ["La technique 4-6","La règle d'or : expirer plus longtemps qu'inspirer.\n1️⃣ Inspirez par le nez pendant 4 secondes, en gonflant le ventre.\n2️⃣ Expirez lentement par la bouche pendant 6 secondes.\n3️⃣ Répétez pendant 2 à 5 minutes.\nÀ pratiquer 2-3 fois par jour et à chaque montée de stress. Effet calmant garanti dès la première minute."]],
  q:[["Quel est le principe clé de la respiration anti-stress ?",["Expirer plus longtemps qu'inspirer","Retenir son souffle 2 minutes","Respirer très vite"],0,"L'expiration lente active le système nerveux du calme et fait chuter le cortisol."],
     ["Combien de temps faut-il pour ressentir l'effet ?",["Quelques minutes","3 semaines","1 an"],0,"La respiration agit immédiatement : c'est le frein de secours du stress."]]},
 {t:"La relaxation",p:[
  ["Déconnecter pour mieux réguler","La relaxation profonde (détente musculaire, méditation, body-scan) baisse durablement le cortisol de fond, la tension artérielle… et améliore les glycémies.\n10 minutes par jour suffisent. Ce n'est pas du temps perdu : c'est un soin, au même titre que vos médicaments et vos repas."],
  ["La détente musculaire progressive","Méthode simple, allongé ou assis :\n1️⃣ Contractez fort les poings 5 secondes… relâchez 15 secondes. Sentez la différence.\n2️⃣ Remontez : avant-bras, épaules, visage, puis descendez : ventre, cuisses, mollets, pieds.\n3️⃣ Terminez par 5 respirations 4-6.\nÀ faire le soir : elle prépare magnifiquement le sommeil. Des applications gratuites peuvent vous guider au début."]],
  q:[["Combien de temps de relaxation quotidienne suffit ?",["10 minutes","4 heures","Aucune relaxation ne sert"],0,"10 minutes par jour baissent durablement le cortisol de fond."],
     ["La détente musculaire progressive consiste à…",["Contracter puis relâcher chaque groupe musculaire","Courir un sprint","Boire un café"],0,"Le contraste contraction-relâchement apprend au corps à lâcher les tensions."]]},
 {t:"La cohérence cardiaque",p:[
  ["Le 3-6-5","La cohérence cardiaque est une technique validée scientifiquement qui synchronise cœur et respiration :\n• 3 fois par jour,\n• 6 respirations par minute (inspirez 5 s, expirez 5 s),\n• pendant 5 minutes.\nEffets mesurés : baisse du cortisol pendant 4 à 6 heures, meilleure variabilité cardiaque, glycémies plus stables chez les diabétiques."],
  ["En pratique","Asseyez-vous confortablement, dos droit.\nInspirez 5 secondes par le nez, expirez 5 secondes par la bouche, sans forcer.\nComptez dans votre tête ou aidez-vous d'une application gratuite (guides visuels).\nMoments idéaux : au réveil (avant le café !), avant le déjeuner, vers 17-18 h. Programmez 3 rappels sur votre téléphone : la régularité fait tout."]],
  q:[["La règle de la cohérence cardiaque est…",["3 fois/jour, 6 respirations/min, 5 minutes","1 fois/mois, 1 minute","10 heures d'affilée"],0,"Le fameux 3-6-5 : simple, gratuit, aux effets mesurés sur le cortisol."],
     ["Combien de temps dure l'effet d'une séance ?",["4 à 6 heures","30 secondes","1 semaine"],0,"Une séance de 5 minutes apaise le système nerveux pour plusieurs heures."]]},
 {t:"La routine du soir",p:[
  ["Le sommeil, régulateur de glycémie","Une seule mauvaise nuit (< 6 h) augmente la résistance à l'insuline de 20 à 30 % dès le lendemain ! Le manque de sommeil augmente aussi la ghréline (hormone de la faim) et les envies de sucre.\nDormir 7 à 8 heures n'est pas un luxe : c'est un traitement du diabète à part entière."],
  ["Construire sa routine","La dernière heure avant le coucher :\n• Écrans en mode nuit, puis extinction 30 min avant (la lumière bleue bloque la mélatonine).\n• Chambre fraîche (18-19 °C), sombre et calme.\n• Pas de repas lourd ni d'alcool tardif ; tisane si envie.\n• 5 minutes d'étirements doux + respiration 4-6 ou relaxation.\n• Couchez-vous et levez-vous à heures régulières, même le week-end.\nNotez votre sommeil dans l'onglet Suivi : vous verrez le lien avec vos glycémies du matin."]],
  q:[["Que provoque une nuit de moins de 6 heures ?",["+20-30 % de résistance à l'insuline le lendemain","Rien du tout","Une meilleure glycémie"],0,"Le manque de sommeil se lit directement sur la glycémie du lendemain."],
     ["Pourquoi éteindre les écrans avant le coucher ?",["La lumière bleue bloque la mélatonine","Pour économiser la batterie","Par superstition"],0,"La mélatonine, hormone du sommeil, est inhibée par la lumière bleue des écrans."]]}
]},
{t:"Les compléments alimentaires",e:"💊",d:"Ce qui peut aider — et ce qu'il faut savoir avant.",ch:[
 {t:"Magnésium et Oméga 3",p:[
  ["Le magnésium","La majorité des diabétiques de type 2 manquent de magnésium — or il participe directement à l'action de l'insuline.\nSignes possibles de manque : crampes, paupière qui saute, fatigue, sommeil léger.\nSources alimentaires d'abord : amandes, épinards, chocolat noir, eaux riches en magnésium. En complément : formes bisglycinate ou citrate (300-400 mg/j), mieux tolérées.\n⚠️ Prudence en cas d'insuffisance rénale : avis médical."],
  ["Les oméga-3","EPA et DHA (poissons gras) sont anti-inflammatoires et font baisser les triglycérides.\nPriorité à l'assiette : sardines, maquereaux, saumon 2-3 fois par semaine.\nEn complément : 1 à 2 g d'EPA+DHA par jour, avec un repas gras.\n⚠️ À signaler au médecin si vous prenez des anticoagulants."]],
  q:[["Pourquoi le magnésium intéresse-t-il les diabétiques ?",["Il participe à l'action de l'insuline","Il colore la peau","Il remplace le sport"],0,"Le manque de magnésium, fréquent chez les diabétiques, aggrave la résistance à l'insuline."],
     ["Quelle est la meilleure source d'oméga-3 ?",["Les poissons gras (sardine, maquereau, saumon)","Les bonbons","Le pain blanc"],0,"2 à 3 portions de poissons gras par semaine couvrent l'essentiel des besoins."]]},
 {t:"Vitamine D et Chrome",p:[
  ["La vitamine D","Un déficit en vitamine D est associé à une moins bonne sensibilité à l'insuline — et 80 % des Français sont en dessous des valeurs optimales en hiver.\nFaites doser votre 25-OH-vitamine D (objectif souvent cité : 40-60 ng/mL).\nSupplémentation courante : 1000 à 4000 UI/jour avec un repas gras, selon le dosage sanguin et l'avis du médecin. Le soleil reste la meilleure source (15-20 min/jour, bras découverts)."],
  ["Le chrome","Le chrome est un oligo-élément qui participe au métabolisme du glucose. Certaines études montrent une amélioration modeste de la glycémie chez les personnes carencées (200-1000 µg/j, picolinate de chrome).\nLes effets restent modestes et inconstants : le chrome ne remplacera jamais la baisse des glucides. Sources alimentaires : brocoli, viandes, œufs."]],
  q:[["Que faut-il faire avant de se supplémenter en vitamine D ?",["Un dosage sanguin (25-OH-D)","Rien","Arrêter ses médicaments"],0,"Le dosage permet d'adapter la dose — et de vérifier les progrès."],
     ["Le chrome peut-il remplacer la réduction des glucides ?",["Oui totalement","Non, ses effets sont modestes","Oui, à forte dose"],1,"Aucun complément ne remplace l'alimentation : le chrome est un appoint, au mieux."]]},
 {t:"Berbérine, cannelle et acide alpha-lipoïque",p:[
  ["La berbérine","La berbérine est le complément le plus étudié sur la glycémie : plusieurs essais montrent des baisses d'HbA1c comparables à certains médicaments (500 mg × 2-3/jour).\n⚠️ Justement parce qu'elle est puissante : risque d'hypoglycémie si elle s'ajoute à un traitement, et interactions médicamenteuses possibles. À ne JAMAIS commencer sans en parler à votre médecin ou pharmacien."],
  ["Cannelle et acide alpha-lipoïque","• Cannelle (de Ceylan de préférence) : 1 à 3 g/jour peuvent réduire légèrement la glycémie à jeun. Facile : dans le yaourt grec, le café, les desserts keto.\n• Acide alpha-lipoïque (ALA) : antioxydant utilisé notamment dans les neuropathies diabétiques (600 mg/j dans les études). Peut potentialiser les hypoglycémiants.\nEncore une fois : informez toujours votre médecin de ce que vous prenez."]],
  q:[["Pourquoi la berbérine impose-t-elle un avis médical ?",["Elle est puissante : risque d'hypoglycémie et d'interactions","Elle ne fait rien","Elle est illégale"],0,"Son efficacité réelle impose la prudence quand elle s'ajoute à un traitement."],
     ["Quelle cannelle privilégier ?",["Cannelle de Ceylan","Cannelle en bonbons","Aucune"],0,"La cannelle de Ceylan contient moins de coumarine que la cannelle casse."]]},
 {t:"Précautions et conditions d'usage",p:[
  ["Les compléments ne remplacent JAMAIS un traitement","Règle absolue : aucun complément alimentaire ne remplace un traitement médical prescrit, ni les fondamentaux (alimentation, mouvement, sommeil).\nLes compléments peuvent être envisagés :\n• en cas de carence documentée (dosage sanguin) ;\n• en appoint d'une hygiène de vie déjà en place ;\n• avec l'accord de votre médecin ou pharmacien, surtout si vous prenez des médicaments."],
  ["Les bons réflexes","• Un seul nouveau complément à la fois : vous saurez ce qui agit (ou pas).\n• Choisissez des marques transparentes (dosages précis, formes citées dans les études).\n• Notez vos glycémies avant/après : c'est votre meilleur juge.\n• Méfiez-vous des promesses miracles (« guérit le diabète ») : elles sont toujours fausses.\n• Signalez TOUT à votre médecin : certains compléments interagissent avec les traitements."]],
  q:[["Un complément alimentaire peut-il remplacer un traitement prescrit ?",["Jamais","Toujours","Le week-end seulement"],0,"Les compléments sont, au mieux, un appoint — jamais un substitut au traitement."],
     ["Pourquoi introduire un seul complément à la fois ?",["Pour identifier ce qui agit réellement","Pour dépenser moins","Par tradition"],0,"Un changement à la fois + suivi des glycémies = évaluation fiable."]]}
]},
{t:"Les traitements",e:"🩺",d:"Comprendre vos médicaments pour mieux dialoguer avec votre médecin.",ch:[
 {t:"La metformine",p:[
  ["Comment elle fonctionne","La metformine (Glucophage®, Stagid®…) est le traitement de première ligne du diabète de type 2 depuis des décennies.\nElle agit principalement en freinant la production de glucose par le foie et en améliorant légèrement la sensibilité à l'insuline. Elle ne fait PAS produire d'insuline : seule, elle ne provoque donc pas d'hypoglycémie."],
  ["Ce qu'il faut savoir","• Effets secondaires fréquents au début : troubles digestifs (souvent transitoires ; les formes à libération prolongée aident).\n• Elle peut diminuer l'absorption de la vitamine B12 sur le long terme (dosage utile).\n• Elle se marie très bien avec l'alimentation pauvre en glucides.\nSi vos glycémies s'améliorent nettement, votre médecin pourra envisager d'adapter la dose — lui seul."]],
  q:[["Comment agit principalement la metformine ?",["Elle freine la production de glucose par le foie","Elle remplace les repas","Elle injecte de l'insuline"],0,"Elle réduit la fabrication hépatique de glucose et améliore la sensibilité à l'insuline."],
     ["La metformine seule provoque-t-elle des hypoglycémies ?",["Non, car elle ne fait pas produire d'insuline","Oui, toujours","Uniquement la nuit"],0,"Sans stimulation de l'insuline, pas d'hypoglycémie avec la metformine seule."]]},
 {t:"L'insuline",p:[
  ["Pourquoi de l'insuline dans le type 2 ?","Après des années de surmenage, le pancréas peut s'épuiser : l'insuline injectée vient alors compléter ou remplacer la production naturelle.\nIl en existe plusieurs types : lente (basale, 1-2 injections/jour) et rapide (au moment des repas). Votre schéma est personnalisé par votre diabétologue."],
  ["Insuline et keto : vigilance maximale","Réduire fortement les glucides diminue les besoins en insuline — c'est le but ! Mais si les doses ne sont pas adaptées, c'est l'hypoglycémie.\nRègles de sécurité :\n• Prévenez votre médecin AVANT de changer d'alimentation.\n• Surveillez vos glycémies plus souvent au début (l'application est là pour ça).\n• Ayez toujours de quoi vous resucrer sur vous.\n• Apprenez les signes d'hypo : tremblements, sueurs, fringale, confusion → resucrage immédiat."]],
  q:[["Pourquoi les doses d'insuline doivent-elles être revues en keto ?",["Les besoins diminuent : risque d'hypoglycémie sinon","Elles doublent","Aucun rapport"],0,"Moins de glucides = moins de besoins : le médecin ajuste pour éviter les hypos."],
     ["Quels sont les signes d'une hypoglycémie ?",["Tremblements, sueurs, fringale, confusion","Envie de dormir 5 min","Cheveux qui frisent"],0,"Ces signes imposent un resucrage immédiat — gardez toujours de quoi sur vous."]]},
 {t:"Les GLP-1",p:[
  ["Les analogues du GLP-1","Sémaglutide (Ozempic®), dulaglutide (Trulicity®), liraglutide (Victoza®)… Ces injections imitent une hormone intestinale, le GLP-1 :\n• elles stimulent l'insuline uniquement quand la glycémie est haute ;\n• elles ralentissent la vidange de l'estomac ;\n• elles coupent l'appétit au niveau du cerveau.\nRésultat : baisse de l'HbA1c et perte de poids souvent significative."],
  ["En pratique","• Effets secondaires fréquents : nausées, troubles digestifs (surtout au début, d'où l'augmentation progressive des doses).\n• Ils se combinent bien avec une alimentation pauvre en glucides — l'appétit déjà réduit facilite les portions raisonnables.\n• Attention à préserver la masse musculaire pendant la perte de poids : protéines suffisantes + renforcement (Module 8).\nL'arrêt se discute toujours avec le médecin (reprise d'appétit fréquente à l'arrêt)."]],
  q:[["Comment agissent les analogues du GLP-1 ?",["Insuline si glycémie haute + satiété + vidange gastrique ralentie","Ils ajoutent du sucre","Ils remplacent le sport"],0,"Triple action : insuline intelligente, estomac ralenti, appétit réduit."],
     ["Que faut-il préserver pendant la perte de poids sous GLP-1 ?",["La masse musculaire (protéines + renforcement)","Les fringales","Le grignotage"],0,"Protéines suffisantes et renforcement évitent de perdre du muscle avec la graisse."]]},
 {t:"Les inhibiteurs SGLT2",p:[
  ["Faire fuir le sucre par les urines","Les gliflozines — empagliflozine (Jardiance®), dapagliflozine (Forxiga®) — bloquent la réabsorption du glucose par les reins : l'excès de sucre est éliminé dans les urines.\nBénéfices démontrés au-delà de la glycémie : protection du cœur et des reins, légère perte de poids et baisse de la tension."],
  ["Précautions spécifiques","• Risque d'infections urinaires et génitales (le sucre dans les urines nourrit les microbes) : hygiène et hydratation.\n• ⚠️ IMPORTANT avec le keto : les SGLT2 augmentent le risque rare d'acidocétose « à glycémie normale ». L'association keto + SGLT2 impose l'avis de votre médecin — c'est LE point à aborder avant de réduire fortement les glucides.\n• Signes d'alerte : nausées, douleurs abdominales, respiration rapide → consultez en urgence."]],
  q:[["Comment agissent les inhibiteurs SGLT2 ?",["Ils font éliminer le glucose dans les urines","Ils bloquent la respiration","Ils ajoutent de l'insuline"],0,"Les reins n'ont plus le droit de réabsorber le glucose : il part dans les urines."],
     ["Pourquoi le duo SGLT2 + keto impose-t-il un avis médical ?",["Risque rare d'acidocétose à glycémie normale","Ça coûte cher","Aucune raison"],0,"C'est LE point de vigilance à discuter avec le médecin avant de réduire les glucides."]]},
 {t:"Ne jamais arrêter seul un traitement",p:[
  ["La règle d'or absolue","Vos glycémies s'améliorent ? Formidable — c'est le but ! Mais arrêter ou réduire un traitement vous-même est dangereux :\n• effet rebond possible sur les glycémies ;\n• certains traitements protègent AUSSI le cœur et les reins, indépendamment du sucre ;\n• seule une vision d'ensemble (analyses, antécédents) permet de décider."],
  ["Comment en parler à votre médecin","Préparez votre consultation :\n1️⃣ Apportez vos relevés de glycémies (l'historique de l'application).\n2️⃣ Expliquez votre changement d'alimentation, chiffres à l'appui.\n3️⃣ Posez la question : « Mes doses sont-elles toujours adaptées ? »\nLes médecins DÉprescrivent volontiers quand les résultats sont là. Votre rôle : fournir des données fiables. Le sien : décider en sécurité. C'est un travail d'équipe."]],
  q:[["Vos glycémies s'améliorent nettement. Que faites-vous ?",["J'arrête mes médicaments moi-même","J'apporte mes relevés au médecin pour qu'il adapte","Je ne dis rien à personne"],1,"Le médecin déprescrit volontiers face à de bons chiffres — mais lui seul décide."],
     ["Pourquoi certains traitements ne se jugent-ils pas qu'au sucre ?",["Ils protègent aussi le cœur et les reins","Ils changent de couleur","Ils sont gratuits"],0,"SGLT2 et GLP-1 notamment ont des bénéfices cardio-rénaux propres."]]}
]},
{t:"Le suivi",e:"📈",d:"Mesurer, ajuster, durer : la boucle du succès.",ch:[
 {t:"Poids et tour de taille",p:[
  ["Bien se peser","• 1 fois par semaine suffit (le poids fluctue de ±1-2 kg naturellement : eau, digestion…).\n• Toujours dans les mêmes conditions : le matin, à jeun, après être passé aux toilettes.\n• Regardez la TENDANCE sur 4 semaines, jamais le chiffre du jour.\nEnregistrez chaque pesée dans l'onglet Suivi : la courbe parle mieux que la mémoire."],
  ["Le tour de taille, chaque semaine","Le mètre ruban révèle ce que la balance cache : la fonte de la graisse viscérale (Module 6).\nMesurez au niveau du nombril, debout, ventre relâché, à la fin d'une expiration normale.\nObjectifs de santé : < 94 cm (homme), < 80 cm (femme). Même 2 cm de perdus = un vrai progrès métabolique, quel que soit le poids."]],
  q:[["À quelle fréquence se peser ?",["Une fois par semaine, dans les mêmes conditions","5 fois par jour","Jamais"],0,"La tendance hebdomadaire est fiable ; le chiffre quotidien, trompeur."],
     ["Que révèle le tour de taille que la balance ne voit pas ?",["La fonte de la graisse viscérale","L'humeur","La pointure"],0,"Le ventre peut fondre à poids stable : le mètre ruban le détecte."]]},

var PTS_PER_CH = 50;
function pcTotalCh(){ var n=0; PC.forEach(function(m){ n+=m.ch.length; }); return n; }
function pcState(){
  if(typeof profile==='undefined'||!profile) return {done:{},pts:0};
  if(!profile.diabParcours) profile.diabParcours={done:{},pts:0};
  if(!profile.diabParcours.done) profile.diabParcours.done={};
  return profile.diabParcours;
}
function pcPersist(){
  try{ if(typeof save==='function') save(); }catch(e){}
  try{ if(typeof syncProfileToCloud==='function' && typeof currentUser!=='undefined' && currentUser) syncProfileToCloud(); }catch(e){}
}
function pcIsDone(mi,ci){ return !!pcState().done[mi+'-'+ci]; }
function pcModDoneCount(mi){ var n=0; PC[mi].ch.forEach(function(_,ci){ if(pcIsDone(mi,ci)) n++; }); return n; }
function pcModPct(mi){ return Math.round(pcModDoneCount(mi)/PC[mi].ch.length*100); }
function pcModUnlocked(mi){ if(mi===0) return true; return pcModPct(mi-1)===100; }
function pcChUnlocked(mi,ci){ if(!pcModUnlocked(mi)) return false; if(ci===0) return true; return pcIsDone(mi,ci-1); }
function pcDoneTotal(){ var n=0; PC.forEach(function(m,mi){ n+=pcModDoneCount(mi); }); return n; }
function pcCurrentModule(){ for(var i=0;i<PC.length;i++){ if(pcModPct(i)<100) return i; } return PC.length-1; }

    '<h3>'+esc(m.t)+'</h3><p>'+esc(m.d)+'</p></div>'+
    '<div class="pc-ring" style="background:conic-gradient(#7ee0b4 '+(pct*3.6)+'deg,rgba(255,255,255,.15) 0deg)"><div class="pc-ring-in">'+pct+'%</div></div>'+
    '</div><div class="pc-chlist">';
  m.ch.forEach(function(c,ci){
    var done=pcIsDone(mi,ci), un=pcChUnlocked(mi,ci);
    h+='<div class="pc-chip'+(un?'':' pc-locked')+'" data-testid="pc-ch-'+mi+'-'+ci+'" '+(un?('onclick="kpPcOpenChapter('+mi+','+ci+')"'):'')+'>'+
      '<div class="pc-chnum'+(done?' pc-ok':'')+'">'+(done?'✓':(ci+1))+'</div>'+
      '<div class="pc-chip-t"><div class="pc-eyebrow">Chapitre '+(ci+1)+' · '+c.p.length+' pages · quiz</div><b>'+esc(c.t)+'</b></div>'+
      '<div class="pc-chip-r">'+(un?'›':'🔒')+'</div></div>';
  });
  h+='</div>';
  r.innerHTML=h;
  window.scrollTo({top:0,behavior:'instant'});
}

function pcRenderChapter(r){
  var m=PC[V.m], c=m.ch[V.c], pg=c.p[V.page], n=c.p.length, last=(V.page===n-1);
  var img = pg[2] ? pg[2] : (V.page===0 ? ('m'+V.m+'c'+V.c) : null);
  var h='<div class="pc-back" onclick="kpPcOpenModule('+V.m+')">← '+esc(m.t)+'</div>'+
    '<div class="pc-eyebrow" style="color:#0f6b5c">Module '+(V.m+1)+' · Chapitre '+(V.c+1)+'</div>'+
    '<div class="pc-h1" style="font-size:21px">'+esc(c.t)+'</div>'+
    '<div class="pc-card" style="margin-top:12px">'+
    (img?('<img class="pc-illus" src="/api/pc-img/'+img+'.jpg" alt="" loading="lazy" onerror="this.style.display=\'none\'">'):'')+
    '<div class="pc-page-h">'+esc(pg[0])+'</div>'+
    '<div class="pc-page-b">'+esc(pg[1])+'</div>'+
    (last&&c.mi?('<div class="pc-mission"><b>🎯 Mission du jour</b>'+esc(c.mi)+'</div>'):'')+
    '</div>'+
    '<div class="pc-foot"><div class="pc-foot-meta"><span>'+(V.page+1)+' / '+n+'</span><span>~'+Math.max(3,Math.round(n*1.2))+' min de lecture</span></div>'+
    '<div class="pc-bar"><i style="width:'+Math.round((V.page+1)/n*100)+'%"></i></div>'+
    '<div class="pc-nav">'+
    '<button class="pc-btn pc-btn-ghost" data-testid="pc-prev" onclick="kpPcPage(-1)" '+(V.page===0?'disabled':'')+'>‹ Précédent</button>'+
    (last?'<button class="pc-btn pc-btn-main" data-testid="pc-start-quiz" onclick="kpPcStartQuiz()">Faire le quiz ✓</button>'
         :'<button class="pc-btn pc-btn-main" data-testid="pc-next" onclick="kpPcPage(1)">Suivant ›</button>')+
    '</div></div>';
  r.innerHTML=h;
  window.scrollTo({top:0,behavior:'instant'});
}

function pcRenderQuiz(r){
  var c=PC[V.m].ch[V.c], q=c.q[V.qi], n=c.q.length, answered=(V.qsel>=0);
  var h='<div class="pc-back" onclick="kpPcOpenChapter('+V.m+','+V.c+')">← Retour au chapitre</div>'+
    '<div class="pc-eyebrow" style="color:#0f6b5c">Quiz — Chapitre '+(V.c+1)+'</div>'+
    '<div class="pc-foot-meta" style="margin-top:8px"><span>Question '+(V.qi+1)+' sur '+n+'</span><span>'+V.qok+' ✓</span></div>'+
    '<div class="pc-bar"><i style="width:'+Math.round(V.qi/n*100)+'%"></i></div>'+
    '<div class="pc-quiz-q">'+esc(q[0])+'</div>';
  q[1].forEach(function(opt,i){
    var cls='';
    if(answered){ if(i===q[2]) cls=' pc-good'; else if(i===V.qsel) cls=' pc-bad'; }
    h+='<div class="pc-opt'+cls+'" data-testid="pc-opt-'+i+'" '+(answered?'':('onclick="kpPcAnswer('+i+')"'))+'>'+
      '<div class="pc-opt-l">'+String.fromCharCode(65+i)+'</div><div>'+esc(opt)+'</div></div>';
  });
  if(answered){
    var good=(V.qsel===q[2]);
    h+='<div class="pc-exp '+(good?'pc-exp-good':'pc-exp-bad')+'"><b>'+(good?'✅ Bonne réponse !':'❌ Pas tout à fait…')+'</b><br>'+esc(q[3])+'</div>'+
      '<div class="pc-nav"><button class="pc-btn pc-btn-main" data-testid="pc-next-q" onclick="kpPcNextQ()">'+(V.qi===n-1?'Voir le résultat 🏅':'Question suivante ›')+'</button></div>';
  }
  r.innerHTML=h;
  window.scrollTo({top:0,behavior:'instant'});
}

function pcRenderCongrats(r){
  var m=PC[V.m], c=m.ch[V.c], n=c.q.length, score=Math.round(V.qok/n*100), pct=pcModPct(V.m);
  var lastCh=(V.c===m.ch.length-1), lastMod=(V.m===PC.length-1);
  var h='<div class="pc-congrats" data-testid="pc-congrats"><div class="pc-medal">🏅</div>'+
    '<h3>Félicitations !</h3><p>Vous avez terminé le chapitre '+(V.c+1)+' — '+esc(c.t)+'</p>'+
    '<div class="pc-cstats">'+
    '<div class="pc-cstat"><b>'+score+'%</b><span>Score quiz</span></div>'+
    '<div class="pc-cstat"><b>'+(V.alreadyDone?'—':'+'+PTS_PER_CH)+'</b><span>Points gagnés</span></div>'+
    '<div class="pc-cstat"><b>'+pcState().pts+'</b><span>Total points</span></div>'+
    '</div>'+
    '<div class="pc-cprog"><div class="pc-foot-meta"><span>Progression du module</span><span>'+pct+'%</span></div>'+
    '<div class="pc-bar"><i style="width:'+pct+'%"></i></div></div>'+
    '<button class="pc-btn pc-btn-main" style="width:100%;background:#fff;color:#0b4a3f" data-testid="pc-continue" onclick="kpPcContinue()">'+
    (lastCh?(lastMod?'Terminer le parcours 🎉':'Module suivant ›'):'Chapitre suivant ›')+'</button>'+
    '<div style="margin-top:12px;font-size:13px;color:#bfe0d5;cursor:pointer;font-weight:600" onclick="kpPcHome()">Retour au parcours</div>'+
    '</div>';
  r.innerHTML=h;
  window.scrollTo({top:0,behavior:'instant'});
}

/* ───────── ACTIONS ───────── */
window.kpPcHome=function(){ V.view='home'; kpPcRender(); };
window.kpPcOpenModule=function(mi){ if(!pcModUnlocked(mi)){ try{ toast('🔒 Terminez d\'abord le module précédent'); }catch(e){} return; } V.view='module'; V.m=mi; kpPcRender(); };
window.kpPcOpenChapter=function(mi,ci){ if(!pcChUnlocked(mi,ci)){ try{ toast('🔒 Terminez d\'abord le chapitre précédent'); }catch(e){} return; } V.view='chapter'; V.m=mi; V.c=ci; V.page=0; kpPcRender(); };
window.kpPcPage=function(d){ var n=PC[V.m].ch[V.c].p.length; V.page=Math.max(0,Math.min(n-1,V.page+d)); kpPcRender(); };
window.kpPcStartQuiz=function(){ V.view='quiz'; V.qi=0; V.qsel=-1; V.qok=0; kpPcRender(); };
window.kpPcAnswer=function(i){ if(V.qsel>=0) return; V.qsel=i; if(i===PC[V.m].ch[V.c].q[V.qi][2]) V.qok++; kpPcRender(); };
window.kpPcNextQ=function(){
  var n=PC[V.m].ch[V.c].q.length;
  if(V.qi<n-1){ V.qi++; V.qsel=-1; kpPcRender(); return; }
  var s=pcState(), key=V.m+'-'+V.c;
  V.alreadyDone=!!s.done[key];
  if(!V.alreadyDone){ s.done[key]={s:Math.round(V.qok/n*100),ts:Date.now()}; s.pts=(s.pts||0)+PTS_PER_CH; pcPersist(); }
  V.view='congrats'; kpPcRender();
};
window.kpPcContinue=function(){
  var m=PC[V.m];
  if(V.c<m.ch.length-1){ kpPcOpenChapter(V.m,V.c+1); return; }
  if(V.m<PC.length-1){ kpPcOpenModule(V.m+1); return; }
  kpPcHome();
};
})();
</script>
<!-- KP-PARCOURS-END -->
