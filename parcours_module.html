<script id="kpParcoursModule">
/* ═══════════ FORMATION DIABÈTE — Onglet « Parcours » ═══════════
   Remplace l'onglet Compléments quand dietMode === 'diabete'.
   Module isolé : injecte CSS + DOM + logique sans toucher au reste. */
(function(){
'use strict';

/* ───────── DONNÉES : 12 modules ───────── */
var PC=[
{t:"Comprendre son diabète",e:"🧠",d:"Comprenez votre corps pour mieux agir au quotidien.",ch:[
 {t:"Bienvenue dans Keto-Essenciel",mi:"Remplissez votre bilan de départ : poids, tour de taille et dernière glycémie à jeun dans l'onglet Suivi.",p:[
  ["Présentation du programme","Bienvenue dans votre parcours Keto-Essenciel spécial diabète de type 2 !\nCe programme de 12 modules vous accompagne pas à pas : comprendre votre diabète, découvrir pourquoi l'alimentation cétogène peut aider, apprendre à bien manger, bouger, gérer le stress et suivre vos progrès.\nChaque module contient des chapitres courts (5 à 10 minutes), avec un quiz pour valider vos acquis et gagner des points."],
  ["Comment utiliser l'application","• L'onglet Plan génère vos menus keto de la semaine, adaptés à votre profil.\n• L'onglet Suivi vous permet de saisir glycémies, traitement, pas, eau et sommeil chaque jour.\n• L'onglet Recettes regroupe plus de 470 recettes pauvres en glucides.\n• Cet onglet Parcours est votre formation : avancez chapitre par chapitre, à votre rythme."],
  ["Vos objectifs","À la fin de ce parcours, vous saurez :\n• expliquer ce qui se passe dans votre corps quand la glycémie monte ;\n• composer des repas qui stabilisent votre glycémie ;\n• lire vos analyses (HbA1c, lipides…) sans stress ;\n• mettre en place activité physique, sommeil et gestion du stress.\n⚠️ Ce programme ne remplace jamais votre médecin : tout changement de traitement se décide avec lui."]],
  q:[["Combien de modules contient ce parcours ?",["8 modules","12 modules","20 modules"],1,"Le parcours compte 12 modules, du fonctionnement du diabète jusqu'au suivi de vos progrès."],
     ["Que devez-vous faire avant de modifier votre traitement ?",["Rien, je décide seul","En parler à mon médecin","Arrêter le traitement d'abord"],1,"Tout changement de traitement doit TOUJOURS être décidé avec votre médecin."]]},
 {t:"Qu'est-ce que le diabète de type 2 ?",p:[
  ["Introduction","Recevoir un diagnostic de diabète de type 2 peut être source d'inquiétude. Pourtant, cette maladie évolue souvent progressivement, et de nombreuses personnes parviennent à améliorer leur équilibre glycémique grâce à des changements de mode de vie.\nPour agir, il faut d'abord comprendre trois acteurs : le glucose, l'insuline et vos cellules."],
  ["Le rôle du glucose","Le glucose est un sucre présent dans le sang. Il provient surtout des glucides que vous mangez : pain, pâtes, riz, sucreries, fruits…\nC'est un carburant : vos muscles et vos organes l'utilisent pour produire de l'énergie. Mais quand il y en a trop dans le sang, trop longtemps, il abîme silencieusement les vaisseaux, les nerfs, les reins et les yeux."],
  ["Le rôle de l'insuline","L'insuline est une hormone produite par le pancréas. On peut l'imaginer comme une clé qui permet au glucose d'entrer dans les cellules pour y être utilisé comme source d'énergie.\nLorsque les cellules répondent correctement à l'insuline, le glucose quitte le sang et la glycémie revient progressivement à un niveau normal."],
  ["La résistance à l'insuline","Dans le diabète de type 2, les serrures des cellules se grippent : c'est la résistance à l'insuline.\nLe pancréas compense en produisant de plus en plus d'insuline, jusqu'à s'épuiser. Le glucose s'accumule alors dans le sang : la glycémie reste élevée.\nBonne nouvelle : la résistance à l'insuline peut s'améliorer avec l'alimentation, l'activité physique et le sommeil."]],
  q:[["Quelle hormone permet au glucose d'entrer dans les cellules ?",["Le glucagon","L'insuline","L'adrénaline"],1,"L'insuline agit comme une clé qui permet au glucose d'entrer dans les cellules."],
     ["Qu'est-ce que la résistance à l'insuline ?",["Le pancréas ne produit plus rien","Les cellules répondent mal à l'insuline","Le sang manque de glucose"],1,"Les cellules deviennent « sourdes » à l'insuline : le glucose reste dans le sang."],
     ["D'où provient principalement le glucose sanguin ?",["Des glucides de l'alimentation","Des protéines","De l'eau"],0,"Pain, pâtes, riz, sucreries… les glucides sont la principale source de glucose."]]},
 {t:"Pourquoi ma glycémie augmente ?",p:[
  ["Le scénario d'un repas riche en glucides","Imaginez : vous mangez une assiette de pâtes avec du pain.\n1️⃣ Les glucides sont digérés et transformés en glucose.\n2️⃣ Le glucose passe dans le sang : la glycémie monte.\n3️⃣ Le pancréas libère de l'insuline.\n4️⃣ Chez une personne insulino-résistante, les cellules répondent mal : la glycémie reste haute pendant des heures."],
  ["Un exemple simple","Pensez à un embouteillage : le glucose, ce sont les voitures ; l'insuline, l'agent de circulation ; les cellules, les parkings.\nSi les parkings n'ouvrent pas leurs barrières (résistance à l'insuline), les voitures s'accumulent sur la route (le sang). Plus vous ajoutez de voitures (glucides), plus l'embouteillage dure."],
  ["Les autres facteurs qui font monter la glycémie","Les glucides ne sont pas seuls responsables :\n• le stress (cortisol) libère du glucose stocké ;\n• une mauvaise nuit de sommeil augmente la résistance à l'insuline dès le lendemain ;\n• la sédentarité : des muscles inactifs consomment très peu de glucose ;\n• certaines infections ou médicaments (cortisone).\nC'est pourquoi ce parcours aborde aussi le sommeil, le stress et l'activité physique."]],
  q:[["Après un repas riche en glucides, la glycémie…",["Baisse immédiatement","Monte","Ne change pas"],1,"Les glucides sont transformés en glucose qui passe dans le sang : la glycémie monte."],
     ["Lequel de ces facteurs peut AUSSI faire monter la glycémie ?",["Le stress","Boire de l'eau","Marcher"],0,"Le cortisol, hormone du stress, libère du glucose stocké dans le foie."]]},
 {t:"Pourquoi le sucre reste dans le sang ?",p:[
  ["Comprendre l'insuline en profondeur","L'insuline a deux missions : faire entrer le glucose dans les cellules ET stopper la libération du glucose stocké dans le foie.\nQuand l'insuline fonctionne mal, ces deux missions échouent : le glucose du repas reste dans le sang, et le foie continue d'en fabriquer. Résultat : une glycémie élevée même à jeun, au réveil."],
  ["Comprendre les cellules","Vos cellules musculaires sont les plus grandes consommatrices de glucose. Mais des muscles peu utilisés, saturés de graisse et d'énergie, ferment leurs portes.\nC'est un cercle vicieux : plus la glycémie et l'insuline restent hautes, plus les cellules résistent.\nLa solution consiste à réduire l'arrivée de glucose (moins de glucides) et à augmenter la consommation (bouger) : c'est exactement la stratégie de ce programme."]],
  q:[["Pourquoi la glycémie peut-elle être haute au réveil, à jeun ?",["Le foie libère du glucose pendant la nuit","On mange en dormant","L'eau se transforme en sucre"],0,"Quand l'insuline fonctionne mal, le foie continue de libérer du glucose, même la nuit."],
     ["Quel organe consomme le plus de glucose ?",["Les cheveux","Les muscles","Les ongles"],1,"Les muscles sont les plus grands consommateurs de glucose — d'où l'importance de bouger."]]},
 {t:"Comprendre l'HbA1c",p:[
  ["Qu'est-ce que l'HbA1c ?","L'hémoglobine glyquée (HbA1c) reflète votre glycémie moyenne des 3 derniers mois.\nLe glucose se colle à l'hémoglobine des globules rouges : plus la glycémie a été haute, plus le pourcentage d'hémoglobine « sucrée » est élevé.\nC'est l'examen de référence pour suivre un diabète, mesuré par une simple prise de sang."],
  ["Que signifient les chiffres ?","• 6 % ≈ glycémie moyenne 1,26 g/L — objectif souvent visé, proche de la normale.\n• 7 % ≈ 1,54 g/L — cible classique pour beaucoup de patients diabétiques.\n• 8 % ≈ 1,83 g/L — équilibre insuffisant, risque de complications qui augmente.\n• 9 % ≈ 2,12 g/L — situation à corriger rapidement avec votre médecin.\nVotre objectif personnel est fixé par votre médecin selon votre âge et votre situation."],
  ["Pourquoi c'est important","Chaque point d'HbA1c en moins réduit fortement le risque de complications (yeux, reins, nerfs, cœur).\nDes études montrent qu'une alimentation pauvre en glucides bien menée peut faire baisser l'HbA1c de 1 à 2 points en quelques mois.\n🎯 Notez votre dernière HbA1c dans l'onglet Suivi : ce sera votre point de départ."]],
  q:[["L'HbA1c reflète la glycémie moyenne sur…",["24 heures","1 semaine","3 mois"],2,"Elle reflète la glycémie moyenne des 3 derniers mois environ."],
     ["Une HbA1c à 9 % signifie…",["Un excellent équilibre","Un équilibre à corriger rapidement","Une valeur normale"],1,"9 % correspond à une glycémie moyenne très élevée : parlez-en vite à votre médecin."]]}
]},
{t:"Pourquoi le Keto ?",e:"🥑",d:"Découvrez pourquoi réduire les glucides change la donne.",ch:[
 {t:"Pourquoi réduire les glucides ?",p:[
  ["La logique est simple","Le diabète de type 2 est une intolérance aux glucides : le corps ne sait plus les gérer.\nRéduire fortement les glucides, c'est réduire directement l'arrivée de glucose dans le sang. Moins de glucose → moins de pics de glycémie → moins de besoin en insuline → le pancréas souffle et les cellules redeviennent progressivement sensibles."],
  ["Ce que ça change au quotidien","En pratique, on remplace pain, pâtes, riz et sucreries par des légumes, des protéines de qualité et de bonnes graisses.\nBeaucoup de personnes constatent en quelques semaines : des glycémies plus stables, moins de fringales, plus d'énergie, et souvent une perte de poids.\n⚠️ Si vous prenez un traitement hypoglycémiant (insuline, sulfamides), la baisse des glucides doit être encadrée par votre médecin pour éviter les hypoglycémies."]],
  q:[["Réduire les glucides permet avant tout de…",["Réduire l'arrivée de glucose dans le sang","Augmenter la glycémie","Remplacer l'insuline"],0,"Moins de glucides = moins de glucose dans le sang = glycémies plus stables."],
     ["Si je prends de l'insuline et que je passe au keto…",["Je ne dis rien à personne","J'en parle à mon médecin pour adapter le traitement","J'arrête l'insuline moi-même"],1,"La baisse des glucides peut nécessiter d'ajuster le traitement : toujours avec le médecin."]]},
 {t:"Qu'est-ce que la cétose ?",p:[
  ["Un second carburant","Votre corps possède deux carburants : le glucose… et les graisses.\nQuand les glucides deviennent rares (moins de 30-50 g par jour), le foie transforme les graisses en cétones, un carburant propre et efficace que le cerveau, le cœur et les muscles adorent.\nCet état s'appelle la cétose nutritionnelle. C'est un mécanisme naturel, utilisé par l'humanité depuis toujours (jeûne, hiver…)."],
  ["Cétose ≠ acidocétose","Ne confondez pas :\n• Cétose nutritionnelle : cétones modérées (0,5-3 mmol/L), état normal et recherché.\n• Acidocétose diabétique : urgence médicale rare, surtout dans le diabète de type 1, avec cétones très élevées ET glycémie très haute.\nEn diabète de type 2 traité sans insuline, la cétose nutritionnelle est généralement sûre — votre médecin reste votre référent."],
  ["Les premiers jours","Pendant 3 à 10 jours, le corps s'adapte : fatigue passagère, maux de tête possibles (« grippe keto »).\nLa parade : boire davantage, saler un peu plus ses plats, dormir suffisamment. Ensuite, l'énergie revient — souvent plus stable qu'avant."]],
  q:[["Les cétones sont…",["Un poison","Un carburant naturel fabriqué à partir des graisses","Un type de sucre"],1,"Le foie transforme les graisses en cétones, carburant apprécié du cerveau et des muscles."],
     ["La cétose nutritionnelle est-elle la même chose que l'acidocétose ?",["Oui, c'est identique","Non, l'acidocétose est une urgence rare, différente","La cétose est plus dangereuse"],1,"La cétose nutritionnelle est modérée et normale ; l'acidocétose est une urgence médicale distincte."]]},
 {t:"Les idées reçues",p:[
  ["« Le cerveau a besoin de sucre »","Vrai à moitié. Le cerveau a besoin d'un peu de glucose… que le foie sait fabriquer lui-même (néoglucogenèse) à partir des protéines.\nSurtout, le cerveau fonctionne très bien — souvent mieux — avec les cétones, qui couvrent jusqu'à 70 % de ses besoins. Aucune obligation de manger du sucre."],
  ["« Le gras fait grossir »","Ce qui fait stocker, c'est l'insuline, et c'est le sucre qui la fait grimper.\nLes bonnes graisses (olive, avocat, oléagineux, poissons gras) rassasient durablement et n'élèvent presque pas la glycémie. Dans un cadre pauvre en glucides, le corps apprend à brûler les graisses au lieu de les stocker."],
  ["« Les œufs donnent du cholestérol »","Les études récentes sont claires : le cholestérol alimentaire influence très peu le cholestérol sanguin (le foie en fabrique 80 %).\nLes œufs sont un aliment complet : protéines parfaites, vitamines, choline. Jusqu'à 2-3 œufs par jour ne posent pas de problème chez la plupart des gens.\nVotre bilan lipidique sera de toute façon suivi (voir Module 7)."]],
  q:[["Le cerveau peut-il fonctionner sans manger de sucre ?",["Non, jamais","Oui : cétones + glucose fabriqué par le foie","Seulement chez les enfants"],1,"Les cétones couvrent une grande partie des besoins, le foie fabrique le reste du glucose."],
     ["Qu'est-ce qui favorise le plus le stockage des graisses ?",["L'insuline élevée en permanence","Les légumes verts","L'eau gazeuse"],0,"L'insuline est l'hormone du stockage — et ce sont les glucides qui la font grimper."]]},
 {t:"Les bénéfices scientifiquement observés",p:[
  ["Poids et diabète","Les études sur l'alimentation cétogène chez les diabétiques de type 2 montrent :\n• une perte de poids supérieure aux régimes pauvres en graisses ;\n• une baisse de l'HbA1c de 1 à 2 points en moyenne ;\n• une réduction, voire un arrêt, de certains traitements (toujours décidé par le médecin) ;\n• des glycémies beaucoup plus stables au quotidien."],
  ["Inflammation, triglycérides, foie gras","• Triglycérides : baisse souvent spectaculaire (ils sont fabriqués à partir des sucres !).\n• HDL (« bon cholestérol ») : augmente.\n• Inflammation (CRP) : diminue.\n• Foie gras (stéatose) : le foie se « dégraisse » quand on supprime sucres et fructose.\nCes marqueurs seront détaillés au Module 7 pour que vous sachiez lire vos analyses."]],
  q:[["Quel effet le keto a-t-il souvent sur les triglycérides ?",["Ils augmentent fortement","Ils baissent nettement","Aucun effet"],1,"Les triglycérides sont fabriqués à partir des sucres : moins de sucre = moins de triglycérides."],
     ["La baisse d'HbA1c observée avec le keto est en moyenne de…",["0 point","1 à 2 points","10 points"],1,"Les études montrent une baisse moyenne de 1 à 2 points d'HbA1c en quelques mois."]]},
 {t:"Quand le keto n'est pas indiqué",p:[
  ["Les situations de prudence","L'alimentation cétogène n'est pas pour tout le monde :\n• Diabète de type 1 : risque d'acidocétose, encadrement médical strict indispensable.\n• Grossesse et allaitement : les besoins sont différents, avis médical obligatoire.\n• Certaines maladies rares du métabolisme (déficits enzymatiques), insuffisance rénale ou hépatique sévère, antécédents de pancréatite."],
  ["Traitements particuliers","Certains médicaments imposent une adaptation AVANT de réduire les glucides :\n• Insuline et sulfamides : risque d'hypoglycémie → doses à ajuster avec le médecin.\n• Inhibiteurs SGLT2 (gliflozines) : risque rare d'acidocétose « normoglycémique » → en parler impérativement à votre médecin.\n🎯 Règle d'or : informez toujours votre médecin de votre changement d'alimentation. Ce parcours vous aide à préparer cette discussion."]],
  q:[["Dans quel cas le keto exige-t-il le plus de prudence ?",["Diabète de type 1","Envie de perdre 2 kg","Végétarisme"],0,"Le diabète de type 1 expose à l'acidocétose : encadrement médical strict indispensable."],
     ["Avec insuline ou sulfamides, réduire les glucides sans adaptation expose à…",["L'hypoglycémie","La prise de poids","Rien du tout"],0,"Le traitement continue de faire baisser la glycémie : sans adaptation, risque d'hypoglycémie."]]}
]},
{t:"Bien manger",e:"🥦",d:"Les bons choix au quotidien, du placard à l'assiette.",ch:[
 {t:"Les aliments à privilégier",p:[
  ["Vos alliés de tous les jours","• Légumes pauvres en glucides : verts à volonté (épinards, courgettes, brocolis, salades, choux, avocat).\n• Protéines de qualité : œufs, volailles, viandes, poissons (gras notamment : sardine, maquereau, saumon), fruits de mer.\n• Bonnes graisses : huile d'olive, avocat, beurre, oléagineux (amandes, noix), olives.\n• Laitages gras et fermentés : fromages, yaourt grec nature, crème."],
  ["Comment composer l'assiette","La formule simple de chaque repas :\n1️⃣ Une belle portion de protéines (main entière).\n2️⃣ Des légumes verts pour la moitié de l'assiette.\n3️⃣ Des bonnes graisses pour l'énergie et la satiété (filet d'huile, avocat, fromage).\nCette assiette élève très peu la glycémie et cale pour des heures."]],
  q:[["Quels légumes privilégier en keto ?",["Pommes de terre et maïs","Légumes verts : brocolis, épinards, courgettes","Aucun légume"],1,"Les légumes verts sont pauvres en glucides et riches en fibres et minéraux."],
     ["Que doit contenir chaque repas ?",["Uniquement des graisses","Protéines + légumes verts + bonnes graisses","Surtout des céréales"],1,"C'est la formule d'une assiette qui stabilise la glycémie et rassasie durablement."]]},
 {t:"Les aliments à limiter",p:[
  ["Les grands responsables","À réduire fortement (car transformés en glucose) :\n• Sucre, sodas, jus de fruits, pâtisseries, bonbons.\n• Féculents : pain, pâtes, riz, pommes de terre, céréales du petit-déjeuner.\n• Légumineuses en grande quantité et fruits très sucrés (banane, raisin, mangue).\n• Produits « allégés en graisses » : souvent bourrés de sucre !"],
  ["Les pièges cachés","Le sucre se cache partout : sauces industrielles, plats préparés, charcuteries premier prix, vinaigrettes du commerce, yaourts aux fruits (jusqu'à 4 morceaux de sucre chacun !).\nMéfiez-vous aussi des « faux amis » : galettes de riz (index glycémique explosif), miel et sirop d'agave (du sucre, tout simplement), jus de fruits « sans sucres ajoutés » (déjà pleins de sucre naturel)."]],
  q:[["Un jus de fruit « sans sucres ajoutés »…",["Ne contient pas de sucre","Contient déjà beaucoup de sucre naturel","Fait baisser la glycémie"],1,"Un verre de jus d'orange contient l'équivalent de 4 à 5 morceaux de sucre."],
     ["Les produits « 0 % de matières grasses » sont…",["Toujours parfaits en keto","Souvent enrichis en sucre","Interdits par la loi"],1,"Pour compenser le goût, les industriels remplacent souvent le gras par du sucre."]]},
 {t:"Lire les étiquettes",p:[
  ["Les 3 réflexes","1️⃣ Regardez la ligne « Glucides » pour 100 g : visez moins de 5 g pour les produits du quotidien.\n2️⃣ « dont sucres » : plus c'est bas, mieux c'est.\n3️⃣ La liste d'ingrédients : courte = bon signe. Les ingrédients sont classés par quantité décroissante — si le sucre est dans les 3 premiers, reposez le produit !"],
  ["Les noms de code du sucre","Le sucre avance masqué sous plus de 50 noms : sirop de glucose-fructose, dextrose, maltodextrine, saccharose, sirop de maïs, jus de canne évaporé, malt d'orge…\nRègle simple : les mots en « -ose » et les « sirops » = sucre.\n🎯 Mission pratique : au prochain passage en cuisine, vérifiez l'étiquette de votre sauce tomate ou vinaigrette."]],
  q:[["Pour 100 g, un produit keto du quotidien devrait contenir…",["Moins de 5 g de glucides","30 g de glucides","70 g de glucides"],0,"Moins de 5 g/100 g : un bon repère pour les produits consommés régulièrement."],
     ["« Sirop de glucose-fructose » dans une liste d'ingrédients, c'est…",["Une fibre","Du sucre déguisé","Une vitamine"],1,"Les mots en « -ose » et les « sirops » désignent presque toujours du sucre."]]},
 {t:"Faire ses courses",p:[
  ["La stratégie du magasin","Faites le tour du magasin par les rayons frais : légumes, viandes, poissons, œufs, fromages. Évitez au maximum les rayons centraux (biscuits, céréales, sodas).\nNe faites jamais les courses le ventre vide : la faim fait acheter du sucre.\nUtilisez la liste de courses générée par l'application (onglet Plan → Courses) : elle correspond exactement à vos menus de la semaine."],
  ["Le panier type Keto-Essenciel","• Frais : œufs, poulet, bœuf, saumon, sardines, crème entière, beurre, fromages.\n• Légumes : courgettes, brocolis, épinards, salades, avocats, choux-fleurs, champignons.\n• Épicerie : huile d'olive, olives, amandes, noix, thon, chocolat noir 85 %+, farine d'amande.\n• Boissons : eau, eau gazeuse, café, thé.\nAvec ce panier, impossible de se tromper."]],
  q:[["Où trouve-t-on l'essentiel des courses keto ?",["Rayons frais : légumes, viandes, poissons, œufs","Rayon biscuits","Rayon sodas"],0,"Le tour du magasin par les rayons frais couvre 90 % du panier keto."],
     ["Pourquoi éviter les courses le ventre vide ?",["On marche trop vite","La faim pousse vers les produits sucrés","C'est interdit"],1,"La faim augmente les achats impulsifs de produits sucrés et transformés."]]},
 {t:"Organiser ses repas",p:[
  ["La routine gagnante","• Planifiez la semaine en 5 minutes avec le générateur de menus (onglet Plan).\n• Cuisinez en double : le dîner d'aujourd'hui devient le déjeuner de demain.\n• Gardez des solutions de secours : œufs durs, sardines, fromage, avocat, jambon de qualité — un repas keto prêt en 3 minutes.\n• Au restaurant : viande ou poisson + légumes, sauce au beurre, et « sans le pain, merci »."],
  ["Le rythme des repas","Écoutez votre faim réelle : en keto, elle diminue naturellement. Beaucoup passent à 2 repas par jour sans effort — c'est excellent pour la glycémie.\nÉvitez le grignotage permanent : chaque prise alimentaire sollicite l'insuline. Si besoin d'une collation : poignée d'amandes, morceau de fromage ou carré de chocolat noir 85 %."]],
  q:[["Quelle est la meilleure « solution de secours » keto ?",["Un sandwich","Œufs durs + fromage + avocat","Des biscuits"],1,"Des protéines et bonnes graisses prêtes en 3 minutes, sans impact glycémique."],
     ["Pourquoi limiter le grignotage ?",["Chaque prise alimentaire sollicite l'insuline","Ça use les dents","C'est mal vu"],0,"Espacer les repas laisse l'insuline redescendre — essentiel contre la résistance à l'insuline."]]}
]},
{t:"Les menus personnalisés",e:"🥑",d:"Comprendre et maîtriser vos menus sur mesure.",ch:[
 {t:"Comment fonctionne le générateur de menus ?",mi:"Ouvrez le générateur et créez votre premier menu personnalisé. Observez la répartition des repas et les aliments proposés, puis identifiez un repas que vous avez envie de tester cette semaine.",p:[
  ["🎯 Objectifs du chapitre","⏱ Temps de lecture : 8 à 10 minutes.\n\nÀ la fin de ce chapitre, vous serez capable de :\n• comprendre comment Keto-Essenciel crée un menu personnalisé ;\n• savoir pourquoi deux personnes ne reçoivent jamais exactement le même menu ;\n• comprendre l'importance des besoins énergétiques et des macronutriments ;\n• personnaliser votre alimentation selon vos objectifs."],
  ["📖 Pourquoi un menu personnalisé ?","Lorsque l'on souhaite perdre du poids, mieux contrôler sa glycémie ou simplement adopter une alimentation cétogène, il est tentant de copier le menu d'une autre personne. Pourtant, cela fonctionne rarement.\nChaque organisme est unique : votre âge, votre taille, votre poids, votre niveau d'activité physique, vos traitements, vos habitudes alimentaires et vos objectifs influencent vos besoins nutritionnels.\nC'est pourquoi Keto-Essenciel ne propose pas un menu identique pour tous : l'application construit un programme adapté à votre profil afin de vous accompagner de manière plus personnalisée."],
  ["🧠 Comment Keto-Essenciel crée votre menu","Lorsque vous remplissez votre profil, plusieurs informations sont utilisées pour calculer vos besoins.\n• Votre âge : avec les années, le métabolisme ralentit progressivement et la masse musculaire peut diminuer si elle n'est pas entretenue. L'application en tient compte.\n• Votre taille : elle participe au calcul de vos besoins énergétiques. Deux personnes de même poids mais de tailles différentes n'auront pas forcément les mêmes besoins.\n• Votre poids : le poids actuel sert à estimer votre dépense énergétique et à définir un objectif réaliste.\n• Votre activité physique : une personne sédentaire ne dépense pas autant d'énergie qu'une personne qui marche plusieurs kilomètres par jour ou pratique un sport régulièrement. Les apports sont ajustés automatiquement.","m3c0b"],
  ["🎯 Vos objectifs","Le générateur adapte ensuite vos menus selon votre objectif principal.\n• Perdre du poids : l'application crée un léger déficit calorique tout en maintenant un apport suffisant en protéines afin de préserver votre masse musculaire.\n• Stabiliser votre poids : les apports sont calculés pour couvrir vos besoins quotidiens, sans rechercher de perte de poids.\n• Améliorer votre équilibre glycémique : les menus privilégient des aliments à faible impact sur la glycémie et répartissent les glucides de manière cohérente avec une alimentation cétogène.\n• Maintenir votre énergie : les repas favorisent une satiété durable et évitent les variations importantes de glycémie pouvant entraîner des coups de fatigue.","m3c0c"],
  ["🥑 Les macronutriments","Votre alimentation repose sur trois grandes familles de nutriments.\n• Les lipides — la principale source d'énergie en alimentation cétogène : huile d'olive, avocat, poissons gras, œufs, olives, graines et, selon les préférences et la tolérance, oléagineux. Ils contribuent à la satiété et apportent des acides gras essentiels.\n• Les protéines — indispensables au maintien de la masse musculaire et à de nombreuses fonctions de l'organisme : viande, poisson, œufs, volailles, tofu, tempeh ou autres alternatives adaptées.\n• Les glucides — réduits afin de limiter les hausses de glycémie : ils proviennent principalement des légumes pauvres en glucides, avec une place plus limitée pour certains fruits et produits spécifiques selon le profil.","m3c0d"],
  ["⚖️ Pourquoi ne pas copier le menu d'un ami ?","Imaginons deux personnes :\n• Marc, 58 ans, 1,80 m, 105 kg, diabète de type 2, peu actif ;\n• Sophie, 45 ans, 1,65 m, 65 kg, sportive.\nLeurs besoins énergétiques, leurs dépenses et leurs objectifs sont très différents : le même menu pourrait être insuffisant pour l'une et excessif pour l'autre. C'est pourquoi la personnalisation est essentielle.\n\n🔄 Le menu évolue avec vous : votre corps change. Si vous perdez du poids, augmentez votre activité physique ou changez d'objectif, vos besoins changent également. Keto-Essenciel recalcule régulièrement vos menus afin de continuer à vous proposer des apports adaptés.","m3c0e"],
  ["💧 L'importance de l'hydratation","Une alimentation cétogène favorise une élimination plus importante d'eau, notamment au début.\nPensez à :\n• boire régulièrement tout au long de la journée ;\n• maintenir un apport suffisant en sodium, potassium et magnésium si nécessaire, selon les recommandations de votre professionnel de santé.\n\n💡 Le saviez-vous ? Les premières semaines d'une alimentation cétogène sont souvent une période d'adaptation. Une bonne hydratation et un apport suffisant en électrolytes peuvent contribuer à limiter certains inconforts transitoires.","m3c0f"],
  ["📝 À retenir","⚠️ Les erreurs fréquentes :\n❌ Penser que tous les menus keto se valent.\n❌ Manger trop peu par peur des lipides.\n❌ Copier le menu d'une autre personne.\n❌ Modifier son traitement sans avis médical.\n❌ Oublier de boire suffisamment.\n\n✅ Les conseils Keto-Essenciel :\n✔ Faites confiance à votre menu personnalisé.\n✔ Réévaluez régulièrement vos objectifs.\n✔ Soyez patient : les changements durables prennent du temps.\n✔ Concentrez-vous sur vos progrès plutôt que sur la perfection.\n\n📝 À retenir : votre menu est créé selon votre profil et vos objectifs ; deux personnes n'ont pas les mêmes besoins ; les menus évoluent avec votre progression ; une alimentation personnalisée favorise l'adhésion et les résultats."]],
  q:[["Pourquoi Keto-Essenciel personnalise-t-il les menus ?",["Pour que tout le monde mange la même chose","Pour adapter l'alimentation au profil et aux objectifs de chacun","Pour rendre les menus plus compliqués"],1,"Chaque profil (âge, poids, activité, objectifs) génère des besoins différents : le menu s'y adapte."],
     ["Quels éléments influencent le calcul de votre menu ?",["Votre âge uniquement","Votre poids uniquement","Votre activité physique uniquement","Toutes ces réponses : âge, poids, activité et objectifs"],3,"Âge, taille, poids, activité physique et objectifs entrent tous dans le calcul de vos besoins."],
     ["Quel est le principal rôle des lipides en alimentation cétogène ?",["Augmenter la glycémie","Fournir une source d'énergie et favoriser la satiété","Remplacer les protéines"],1,"Les lipides sont le carburant principal du keto et contribuent à la satiété."],
     ["Pourquoi est-il déconseillé de copier le menu d'une autre personne ?",["Parce que chacun a des besoins différents","Parce que les objectifs et le mode de vie varient","Les deux réponses sont exactes"],2,"Besoins, objectifs et mode de vie varient d'une personne à l'autre : la personnalisation est essentielle."],
     ["Les menus doivent-ils rester identiques toute la vie ?",["Oui","Non, ils évoluent avec vos besoins et votre progression"],1,"Poids, activité et objectifs changent : Keto-Essenciel recalcule vos menus régulièrement."]]},
 {t:"Adapter ses menus",p:[
  ["Votre menu, vos règles","Un plat ne vous plaît pas ? Le bouton « Changer » sur chaque repas propose une alternative équivalente en macros.\nVous pouvez aussi exclure des aliments (allergies, dégoûts) dans les réglages : ils n'apparaîtront plus jamais.\nBesoin de plus ou moins de calories ? Ajustez votre objectif dans l'onglet Profil, puis regénérez la semaine."],
  ["Adapter au quotidien réel","Repas à l'extérieur prévu mardi midi ? Ignorez simplement ce créneau et reprenez le plan au repas suivant : aucune culpabilité.\nVous avez mangé le dîner de jeudi mercredi ? Aucun problème, l'ordre des repas keto est interchangeable.\nLe menu est un guide, pas une prison : l'important est de rester pauvre en glucides."]],
  q:[["Que fait le bouton « Changer » sur un repas ?",["Supprime la journée","Propose une recette alternative équivalente","Commande une pizza"],1,"Il remplace le plat par une alternative aux macros similaires."],
     ["Peut-on inverser deux repas de la semaine ?",["Non, jamais","Oui, les repas keto sont interchangeables","Seulement le dimanche"],1,"Le menu est un guide souple : l'essentiel est de rester pauvre en glucides."]]},
 {t:"Remplacer un aliment",p:[
  ["Les équivalences keto","Envie de vos anciens plats ? Tout se remplace :\n• Pâtes → courgettes en spaghettis, konjac.\n• Riz → chou-fleur mixé en « riz », brocoli.\n• Purée → purée de chou-fleur au beurre.\n• Pain → pain keto à la farine d'amande (Module recettes).\n• Sucre → érythritol ou stévia.\n• Farine de blé → farine d'amande ou de coco."],
  ["La règle des échanges","Remplacez toujours un aliment par un équivalent de la même famille : une protéine par une protéine (poulet ↔ poisson), un légume par un légume (brocoli ↔ courgette), une graisse par une graisse (beurre ↔ huile d'olive).\nAinsi, les macros du repas restent stables et votre glycémie aussi."]],
  q:[["Par quoi remplacer le riz en keto ?",["Par des pommes de terre","Par du « riz » de chou-fleur","Par du pain blanc"],1,"Le chou-fleur mixé donne une excellente alternative au riz, quasi sans glucides."],
     ["Pour garder des macros stables, on remplace un aliment par…",["N'importe quoi","Un équivalent de la même famille","Un dessert"],1,"Protéine ↔ protéine, légume ↔ légume, graisse ↔ graisse : l'équilibre est préservé."]]},
 {t:"Le calcul des glucides",p:[
  ["Glucides nets vs totaux","Sur les étiquettes européennes, les fibres sont déjà exclues de la ligne « Glucides ». Ce chiffre correspond donc aux glucides nets — ceux qui élèvent la glycémie.\nEn keto diabète, on vise généralement 20 à 30 g de glucides nets par jour. L'application compte pour vous et affiche le total du jour sur chaque menu."],
  ["Où partent vos 25 g quotidiens ?","Exemple de journée à ~25 g :\n• Petit-déj : omelette fromage-épinards ≈ 3 g.\n• Déjeuner : poulet rôti + brocolis au beurre ≈ 8 g.\n• Dîner : saumon + salade d'avocat ≈ 7 g.\n• Collation : 20 amandes + 2 carrés chocolat 85 % ≈ 6 g.\nVous mangez copieusement… pour l'équivalent glycémique d'une demi-tranche de pain !"]],
  q:[["En keto diabète, on vise environ…",["20 à 30 g de glucides nets/jour","150 g/jour","300 g/jour"],0,"20-30 g nets par jour : le seuil qui permet la cétose et des glycémies stables."],
     ["Sur une étiquette européenne, la ligne « Glucides »…",["Inclut les fibres","Exclut déjà les fibres (glucides nets)","N'existe pas"],1,"En Europe, les fibres sont comptées à part : la ligne Glucides ≈ glucides nets."]]}
]},
{t:"Cuisiner Keto au quotidien",e:"🍳",d:"Toutes les clés pour cuisiner keto avec plaisir.",ch:[
 {t:"Les bases d'une cuisine keto réussie",mi:"Ouvrez vos placards et votre réfrigérateur : vérifiez si vous disposez des ingrédients essentiels, faites une liste des produits manquants et choisissez une recette simple que vous réaliserez cette semaine.",p:[
  ["👋 Bienvenue !","Félicitations ! Vous savez maintenant choisir les bons aliments et créer des menus adaptés à vos objectifs. Il est temps de passer en cuisine.\nRassurez-vous : cuisiner keto ne signifie pas passer des heures derrière les fourneaux. Au contraire, les recettes les plus efficaces sont souvent les plus simples.\nDans ce chapitre, vous découvrirez comment organiser votre cuisine pour préparer des repas savoureux, équilibrés et rapides à réaliser."],
  ["🎯 Objectifs du chapitre","⏱ Temps de lecture : 8 à 10 minutes.\n\nÀ la fin de cette leçon, vous serez capable de :\n✅ organiser votre cuisine efficacement ;\n✅ identifier les ingrédients indispensables ;\n✅ choisir les bonnes matières grasses ;\n✅ utiliser les épices pour varier les saveurs ;\n✅ éviter les erreurs les plus fréquentes.\n\n🥘 Pourquoi une cuisine bien organisée ? Lorsque tout est à portée de main, cuisiner devient plus simple. À l'inverse, si vous manquez d'ingrédients ou d'organisation, vous risquez davantage de vous tourner vers des produits ultra-transformés ou des repas improvisés. Une cuisine bien préparée est souvent le premier pas vers une alimentation durable."],
  ["🧂 Les indispensables du placard Keto","Avant de cuisiner, constituez une base d'aliments que vous utiliserez régulièrement.\n\n🫒 Les matières grasses :\n✔ huile d'olive vierge extra ;\n✔ beurre ;\n✔ ghee ;\n✔ huile d'avocat ;\n✔ huile de coco (selon les recettes).\n💡 Astuce : privilégiez les huiles vierges, peu transformées, et évitez les huiles riches en oméga-6 utilisées en friture répétée.\n\n🧄 Les aromates — les épices transforment un plat simple en repas gourmand : ail, oignon en poudre, curcuma, curry, paprika, cumin, herbes de Provence, origan, basilic, romarin, thym, poivre. Chaque épice apporte une identité différente à vos plats.","m4c0b"],
  ["🥬 Légumes et 🥩 protéines","🥬 Gardez toujours quelques légumes faciles à cuisiner : 🥦 brocoli, 🥒 courgettes, épinards, salade, 🫑 poivrons, 🍄 champignons, concombres, 🧅 oignons (avec modération selon vos objectifs). Ces légumes sont polyvalents et s'intègrent facilement à de nombreuses recettes.\n\n🥩 Pensez à toujours avoir des protéines : 🐔 blanc de poulet, steak haché, 🐟 saumon, sardines, 🥚 œufs, 🧀 fromage, jambon de qualité.\nVous pouvez également congeler des portions pour gagner du temps.","m4c0c"],
  ["🔪 Les ustensiles indispensables","Inutile d'investir dans une cuisine professionnelle. Quelques équipements suffisent :\n✔ une bonne poêle ;\n✔ un grand couteau de cuisine ;\n✔ une planche à découper ;\n✔ une casserole ;\n✔ un plat allant au four ;\n✔ une balance de cuisine (utile au début) ;\n✔ des boîtes hermétiques pour conserver les repas.","m4c0d"],
  ["🍳 Les modes de cuisson","Les aliments peuvent être préparés de nombreuses façons.\n• Poêle : rapide et pratique, parfaite pour les viandes, poissons et légumes.\n• Four : idéal pour cuire plusieurs portions en même temps, très utile pour le batch cooking.\n• Air Fryer : permet d'obtenir des aliments croustillants avec peu de matière grasse ajoutée.\n• Mijotage : excellent pour les plats riches en saveurs.\n\n💧 Ne négligez pas l'hydratation : en alimentation cétogène, l'organisme élimine davantage d'eau, surtout au début. Buvez régulièrement et assurez un apport suffisant en électrolytes selon les recommandations de votre professionnel de santé.","m4c0e"],
  ["❌ Erreurs fréquentes et 💡 conseils","🚫 Les erreurs les plus fréquentes :\n• vouloir acheter tous les produits keto du commerce ;\n• utiliser uniquement du fromage dans les recettes ;\n• oublier les légumes ;\n• ne jamais varier les épices ;\n• cuisiner trop compliqué ;\n• croire qu'il faut des ingrédients rares.\n\n💡 Les conseils Keto-Essenciel :\n✔ commencez avec des recettes simples ;\n✔ préparez davantage de portions pour les repas suivants ;\n✔ testez une nouvelle recette chaque semaine ;\n✔ gardez toujours des aliments prêts à cuisiner au réfrigérateur ou au congélateur ;\n✔ n'hésitez pas à personnaliser les assaisonnements selon vos goûts."],
  ["📝 À retenir","Une cuisine keto réussie repose avant tout sur :\n🥑 des aliments simples ;\n🥩 des protéines de qualité ;\n🫒 de bonnes matières grasses ;\n🥬 beaucoup de légumes pauvres en glucides ;\n🌿 des épices pour varier les saveurs ;\n🧑‍🍳 une bonne organisation.\n\n🏅 Badge à débloquer en validant le quiz : « Ma cuisine est prête »"]],
  q:[["Quel est le meilleur moyen de cuisiner keto durablement ?",["Acheter uniquement des produits spécialisés","Organiser sa cuisine avec des ingrédients simples","Manger toujours les mêmes plats"],1,"Une cuisine organisée avec des ingrédients simples est le premier pas vers une alimentation durable."],
     ["Quelle matière grasse est un excellent choix au quotidien ?",["Margarine hydrogénée","Huile d'olive vierge extra","Huile de tournesol raffinée"],1,"Privilégiez les huiles vierges, peu transformées, comme l'huile d'olive vierge extra."],
     ["Pourquoi utiliser des épices ?",["Pour augmenter les glucides","Pour varier les saveurs sans ajouter de sucre","Pour remplacer les légumes"],1,"Les épices transforment un plat simple en repas gourmand, sans impact glycémique."],
     ["Quel équipement est réellement indispensable ?",["Un robot multifonction haut de gamme","Une bonne poêle et un couteau de qualité","Une machine à pain"],1,"Pas besoin d'une cuisine professionnelle : poêle, couteau et planche suffisent pour démarrer."],
     ["Quelle est la meilleure stratégie ?",["Préparer plusieurs portions à l'avance","Avoir des aliments simples toujours disponibles","Les deux réponses sont correctes"],2,"Portions d'avance + aliments simples disponibles = des repas keto sans effort toute la semaine."]]},
 {t:"Le petit-déjeuner keto : bien démarrer sa journée",mi:"Cette semaine, essayez deux nouveaux petits-déjeuners keto. Après chaque repas, notez : ⭐ votre niveau de faim avant de manger, ⭐ votre sensation de satiété après, ⭐ votre niveau d'énergie en fin de matinée, ⭐ et si vous mesurez votre glycémie, observez son évolution selon les recommandations de votre professionnel de santé. Ces observations vous aideront à identifier les petits-déjeuners qui vous conviennent le mieux.",p:[
  ["👋 Introduction","Pendant longtemps, on nous a appris qu'un « bon petit-déjeuner » devait contenir du pain, des céréales, de la confiture ou du jus de fruits.\nPourtant, chez de nombreuses personnes atteintes de diabète de type 2, ce type de repas peut provoquer une augmentation rapide de la glycémie, suivie d'une baisse d'énergie et d'un retour de la faim quelques heures plus tard.\nL'objectif d'un petit-déjeuner keto est différent : il vise à apporter une énergie plus stable, une meilleure satiété et un impact glycémique plus faible."],
  ["🎯 Les objectifs de ce chapitre","⏱ Temps de lecture : 8 à 10 minutes.\n\nÀ la fin de cette leçon, vous saurez :\n✅ pourquoi un petit-déjeuner riche en glucides peut favoriser les pics de glycémie ;\n✅ composer un petit-déjeuner keto équilibré ;\n✅ choisir les bons aliments ;\n✅ adapter votre premier repas selon votre faim et votre mode de vie.\n\n🌅 Le petit-déjeuner est-il obligatoire ? Non. Contrairement à une idée répandue, il n'est pas indispensable de manger dès le réveil. Certaines personnes ont faim le matin, d'autres non. L'important est d'écouter vos sensations de faim tout en respectant les recommandations de votre médecin, notamment si vous prenez des médicaments contre le diabète pouvant nécessiter une prise alimentaire. Si vous n'avez pas faim, il n'est pas toujours nécessaire de vous forcer à manger."],
  ["🍞 Pourquoi les petits-déjeuners classiques posent parfois problème ?","Un petit-déjeuner composé de pain blanc, céréales sucrées, viennoiseries ou jus de fruits apporte souvent une quantité importante de glucides rapidement assimilés.\nChez une personne vivant avec un diabète de type 2, cela peut entraîner :\n📈 une hausse importante de la glycémie ;\n📉 une baisse d'énergie quelques heures plus tard ;\n🍪 une envie de grignoter avant le déjeuner.\nL'objectif n'est pas de culpabiliser, mais de comprendre l'impact de certains choix alimentaires.","m4c1b"],
  ["🥑 Les principes d'un petit-déjeuner keto","Un petit-déjeuner keto repose généralement sur trois piliers.\n\n1️⃣ Des protéines de qualité — elles contribuent à la satiété et au maintien de la masse musculaire : 🥚 œufs, 🐔 blanc de poulet, 🧀 fromage, 🥛 yaourt grec nature (selon votre plan alimentaire), 🐟 saumon fumé.\n\n2️⃣ De bonnes matières grasses — elles apportent une énergie durable : 🥑 avocat, 🫒 huile d'olive, 🧈 beurre, 🌰 purée d'amandes ou de noisettes (si elles sont bien tolérées).\n\n3️⃣ Des légumes lorsque cela est possible — oui, il est tout à fait possible d'en manger dès le matin : 🍅 tomates, 🥒 concombre, 🥬 épinards, 🥑 avocat. Ils apportent des fibres, des vitamines et contribuent à la satiété.","m4c1c"],
  ["🍽️ Exemples de petits-déjeuners keto","🍳 Option 1 – L'assiette complète : 2 ou 3 œufs, avocat, tomates cerises, quelques feuilles de salade, huile d'olive.\n\n🐟 Option 2 – Le petit-déjeuner nordique : saumon fumé, fromage frais, concombre, avocat.\n\n🥣 Option 3 – Rapide : yaourt grec nature, graines de chia, quelques fruits rouges (en petite quantité selon votre plan alimentaire).\n\n🧀 Option 4 – Sans cuisson : fromage, jambon de qualité, avocat, quelques noix ou graines si elles sont adaptées à votre profil.\n\n🥬 Option 5 – Version salée : omelette aux légumes, fromage râpé, herbes fraîches.","m4c1d"],
  ["☕ Café et boissons","Le café peut faire partie du petit-déjeuner chez certaines personnes. Cependant :\n✔ évitez le sucre ajouté ;\n✔ soyez attentif à votre tolérance personnelle ;\n✔ privilégiez l'eau comme principale boisson de la matinée.\n\n🧃 À privilégier : 💧 eau, 🍵 thé, ☕ café non sucré, 🌿 infusions.\nÀ limiter : 🥤 sodas sucrés, 🧃 jus de fruits, boissons énergisantes sucrées.","m4c1e"],
  ["🧠 Le rassasiement","Le but d'un petit-déjeuner keto n'est pas de manger plus. Le but est de manger mieux. Un repas équilibré permet souvent de rester rassasié plusieurs heures, ce qui peut réduire les envies de grignotage.\n\n❌ Les erreurs fréquentes :\n🚫 continuer à boire du jus de fruits « parce que c'est naturel » ;\n🚫 avoir peur des bonnes matières grasses ;\n🚫 supprimer les protéines ;\n🚫 manger uniquement du fromage ;\n🚫 remplacer un croissant par une barre « keto » ultra-transformée.\n\n💡 Les conseils Keto-Essenciel :\n✔ prenez le temps de tester plusieurs petits-déjeuners ;\n✔ alternez les recettes pour éviter la monotonie ;\n✔ préparez certains éléments la veille si vos matinées sont chargées ;\n✔ adaptez les portions à votre faim."],
  ["📝 À retenir","👨‍🍳 Idées de recettes à découvrir dans l'onglet Recettes de l'application :\n🍳 omelette méditerranéenne ;\n🥑 avocat farci au saumon ;\n🧀 muffins aux œufs et fromage ;\n🥣 pudding de chia ;\n🥬 wrap keto à la laitue.\n\n📝 À retenir :\n✔ il n'existe pas un seul petit-déjeuner idéal ;\n✔ les protéines favorisent la satiété ;\n✔ les bonnes graisses apportent une énergie durable ;\n✔ les boissons sucrées augmentent rapidement la glycémie ;\n✔ l'objectif est de trouver une routine qui vous convient.\n\n🏅 Badge à débloquer en validant le quiz : « Le matin en toute sérénité »"]],
  q:[["Un petit-déjeuner est-il obligatoire pour tout le monde ?",["Oui","Non, cela dépend de la personne et de sa situation"],1,"Écoutez votre faim, en respectant les recommandations de votre médecin selon votre traitement."],
     ["Quel est l'objectif principal d'un petit-déjeuner keto ?",["Apporter le plus de glucides possible","Favoriser une énergie stable et une bonne satiété"],1,"Énergie stable, satiété durable et impact glycémique faible : les trois buts du petit-déj keto."],
     ["Quel aliment est une bonne source de protéines ?",["Confiture","Œufs","Jus de fruits"],1,"Les œufs sont une excellente source de protéines complètes pour bien démarrer la journée."],
     ["Quelle boisson est généralement préférable au petit-déjeuner ?",["Soda","Jus de fruits","Eau ou thé non sucré"],2,"Les boissons sucrées font grimper la glycémie : eau, thé ou café non sucré sont vos alliés."],
     ["Pourquoi les protéines sont-elles importantes au petit-déjeuner ?",["Elles contribuent à la satiété et au maintien de la masse musculaire","Elles remplacent les légumes","La première réponse est correcte"],2,"Satiété durable + maintien du muscle : les deux grands rôles des protéines du matin."]]},
 {t:"Déjeuners et dîners : construire une assiette keto équilibrée",mi:"Préparez votre prochain déjeuner ou dîner en suivant la méthode de l'assiette Keto-Essenciel. Avant de commencer votre repas, observez votre assiette : ai-je une source de protéines ? Ai-je suffisamment de légumes ? Ai-je ajouté une bonne matière grasse ?",p:[
  ["👋 Introduction","Le déjeuner et le dîner sont souvent les repas les plus complets de la journée. Une assiette bien équilibrée permet de favoriser la satiété, de limiter les variations de glycémie et de couvrir vos besoins nutritionnels.\nLa bonne nouvelle ? Pas besoin de recettes compliquées : une assiette simple, composée de bons aliments, est souvent la meilleure option.\n\n⏱ Temps de lecture : 5 minutes.\n\n🎯 À la fin de ce chapitre, vous saurez :\n✅ composer une assiette keto équilibrée ;\n✅ choisir les bonnes proportions ;\n✅ varier les aliments sans vous compliquer la vie."],
  ["🍽️ La méthode de l'assiette Keto-Essenciel","Pour construire facilement un repas, pensez à ces trois éléments :\n\n🥩 1. Une source de protéines de qualité : poulet, dinde, bœuf, poisson, œufs, tofu ou tempeh. Les protéines participent au maintien de la masse musculaire et favorisent la satiété.\n\n🥦 2. Beaucoup de légumes pauvres en glucides : brocoli, courgettes, haricots verts, chou-fleur, salade, épinards, champignons. Ils apportent des fibres, des vitamines et du volume au repas.\n\n🫒 3. De bonnes matières grasses : huile d'olive, avocat, beurre, fromage (avec modération selon vos objectifs). Ces aliments contribuent à la satiété et apportent de l'énergie.","m4c2b"],
  ["🍴 Exemples d'assiettes","🐟 Assiette méditerranéenne : saumon grillé, courgettes sautées, salade verte, huile d'olive.\n\n🥩 Assiette gourmande : steak haché, brocoli vapeur, beurre aux herbes.\n\n🐔 Assiette légère : blanc de poulet, ratatouille maison, avocat.","m4c2c"],
  ["💡 Astuce Keto-Essenciel","Essayez d'avoir au moins trois couleurs différentes dans votre assiette. Cela favorise la variété des nutriments et rend le repas plus appétissant.\n\n⚠️ Les erreurs fréquentes :\n❌ oublier les légumes ;\n❌ manger uniquement de la viande et du fromage ;\n❌ utiliser trop de produits industriels « keto » ;\n❌ ne pas varier les sources de protéines.","m4c2d"],
  ["📝 À retenir","✔ Une bonne assiette keto est simple.\n✔ Elle associe protéines, légumes et bonnes graisses.\n✔ La variété est essentielle pour couvrir vos besoins nutritionnels.\n\n🏅 Badge à débloquer en validant le quiz : « J'équilibre mon assiette »"]],
  q:[["Quels sont les trois piliers d'une assiette keto ?",["Pain, viande, dessert","Protéines, légumes pauvres en glucides et bonnes matières grasses"],1,"Protéines + légumes + bonnes graisses : la méthode de l'assiette Keto-Essenciel."],
     ["Pourquoi les légumes sont-ils importants ?",["Ils apportent des fibres, des vitamines et du volume","Ils remplacent les protéines","La première réponse est correcte"],2,"Fibres, vitamines et volume : les légumes remplissent l'assiette sans élever la glycémie."],
     ["Quelle matière grasse est un bon choix ?",["Huile d'olive vierge extra","Avocat","Les deux réponses sont correctes"],2,"Huile d'olive et avocat sont deux excellentes sources de lipides de qualité."],
     ["Faut-il manger toujours la même protéine ?",["Oui","Non, il est préférable de varier"],1,"Varier les protéines (viande, poisson, œufs, tofu…) couvre mieux vos besoins nutritionnels."],
     ["Une assiette keto doit-elle être compliquée ?",["Oui","Non, la simplicité est souvent la meilleure solution"],1,"Une assiette simple avec de bons aliments est souvent la meilleure option."]]},
 {t:"Les collations : en avez-vous vraiment besoin ?",mi:"Aujourd'hui, avant chaque collation éventuelle : évaluez votre faim sur une échelle de 1 à 10, buvez un verre d'eau, attendez quelques minutes. Si la faim est toujours présente, choisissez une collation simple et équilibrée. Prenez quelques notes dans votre journal alimentaire : cela vous aidera à mieux connaître vos habitudes.",p:[
  ["👋 Introduction","Avez-vous vraiment faim… ou avez-vous simplement envie de manger ?\nDans une alimentation cétogène, de nombreuses personnes constatent qu'elles ont naturellement moins faim entre les repas. Grâce à des repas riches en protéines, en fibres et en bonnes graisses, la sensation de satiété dure souvent plus longtemps.\nL'objectif n'est donc pas de manger plus souvent, mais de manger lorsque votre corps en a réellement besoin.\n\n⏱ Temps de lecture : 4 minutes.\n\n🎯 À la fin de ce chapitre, vous saurez :\n✅ faire la différence entre une vraie faim et une envie de manger ;\n✅ choisir une collation adaptée si nécessaire ;\n✅ éviter le grignotage par habitude ou par émotion."],
  ["🤔 Faim ou envie de manger ?","Avant de prendre une collation, posez-vous ces trois questions :\n✔ mon estomac a-t-il réellement faim ?\n✔ ai-je simplement envie de sucre ou de grignoter ?\n✔ est-ce que je mange parce que je m'ennuie, je suis stressé ou fatigué ?\nPrendre quelques instants pour réfléchir permet souvent d'éviter un grignotage inutile.\n\n🥜 Quand une collation peut être utile — une collation n'est pas un échec. Elle peut être utile si :\n• vous avez un long intervalle entre deux repas ;\n• vous avez fait une activité physique importante ;\n• vous ressentez une véritable sensation de faim ;\n• votre professionnel de santé vous recommande de ne pas rester trop longtemps sans manger en raison de votre traitement.","m4c3b"],
  ["🥑 Idées de collations keto","Si vous avez réellement faim, privilégiez des aliments simples :\n🥚 œuf dur ;\n🧀 un morceau de fromage ;\n🥒 bâtonnets de concombre ou de céleri avec un fromage frais ;\n🥑 quelques tranches d'avocat ;\n🐟 sardines ou maquereau ;\n🫒 quelques olives ;\n🥛 yaourt grec nature (selon votre plan alimentaire).\nL'objectif est de calmer la faim, pas de remplacer un repas.","m4c3c"],
  ["🚫 Les pièges à éviter","Même si un produit porte la mention « keto » ou « sans sucre ajouté », cela ne signifie pas qu'il est toujours intéressant sur le plan nutritionnel.\nSoyez attentif :\n❌ aux barres ultra-transformées ;\n❌ aux biscuits « low carb » ;\n❌ aux boissons sucrées ou édulcorées consommées en grande quantité.\nPrivilégiez autant que possible des aliments bruts ou peu transformés.\n\n💡 Astuce Keto-Essenciel : avant de prendre une collation, buvez un grand verre d'eau et attendez 10 minutes. Il arrive que la soif soit confondue avec la faim.","m4c3d"],
  ["📝 À retenir","⚠️ Les erreurs fréquentes :\n❌ manger devant la télévision sans s'en rendre compte ;\n❌ grignoter toute la journée ;\n❌ croire qu'une collation est obligatoire ;\n❌ choisir uniquement des produits industriels.\n\n📝 À retenir :\n✔ une collation n'est pas indispensable pour tout le monde ;\n✔ écoutez votre faim plutôt que vos habitudes ;\n✔ choisissez des aliments simples et rassasiants ;\n✔ limitez le grignotage automatique.\n\n🏅 Badge à débloquer en validant le quiz : « Je maîtrise mes collations »"]],
  q:[["Une collation est-elle obligatoire ?",["Oui","Non, elle dépend de vos besoins et de votre faim"],1,"Écoutez votre faim réelle : en keto, beaucoup n'ont naturellement plus besoin de collation."],
     ["Quel est le premier réflexe avant de grignoter ?",["Prendre une barre keto","Se demander si l'on a réellement faim"],1,"Quelques instants de réflexion évitent souvent un grignotage inutile."],
     ["Quelle collation est un bon choix ?",["Œuf dur, avocat ou olives","Barre « keto » ultra-transformée","Biscuits low carb industriels"],0,"Des aliments simples et bruts : œuf dur, fromage, avocat, olives, sardines…"],
     ["Les produits « keto » industriels sont-ils toujours les meilleurs choix ?",["Oui","Non"],1,"La mention « keto » ne garantit pas la qualité nutritionnelle : privilégiez les aliments bruts."],
     ["Pourquoi boire un verre d'eau avant une collation ?",["Pour vérifier si la sensation de faim n'est pas liée à la soif","Pour remplacer tous les repas"],0,"La soif est souvent confondue avec la faim : un verre d'eau + 10 minutes d'attente font le tri."]]},
 {t:"Se faire plaisir : desserts et gourmandises keto",mi:"Choisissez une recette de dessert dans Keto-Essenciel et préparez-la à la maison. Prenez quelques instants pour observer : votre niveau de satiété, votre plaisir gustatif, et l'absence ou non d'envies de sucre dans les heures qui suivent. Cette observation vous aidera à mieux comprendre ce qui vous convient.",p:[
  ["👋 Introduction","Adopter une alimentation cétogène ne signifie pas renoncer définitivement au plaisir.\nIl est tout à fait possible de savourer un dessert ou une gourmandise, à condition de choisir des recettes adaptées et de les consommer avec modération.\nL'objectif n'est pas de remplacer chaque dessert classique par une version keto, mais d'apprendre à se faire plaisir sans compromettre ses objectifs.\n\n⏱ Temps de lecture : 5 minutes.\n\n🎯 À la fin de ce chapitre, vous serez capable de :\n✅ choisir un dessert compatible avec une alimentation cétogène ;\n✅ comprendre quels ingrédients privilégier ;\n✅ éviter les faux produits « keto » ultra-transformés."],
  ["🍰 Peut-on manger des desserts en keto ?","Oui, mais ils doivent rester occasionnels.\nMême réalisés avec des ingrédients compatibles, les desserts entretiennent parfois l'habitude du goût sucré. L'objectif est donc de retrouver progressivement le plaisir des aliments naturellement peu sucrés.\nConsidérez les desserts keto comme un plaisir ponctuel, et non comme une nécessité quotidienne.\n\n🥣 Les ingrédients à privilégier :\n🥚 œufs ;\n🧈 beurre ;\n🥛 crème entière ;\n🧀 fromage frais ou mascarpone ;\n🥥 noix de coco râpée ;\n🌰 farine d'amande ou de coco (si elles sont compatibles avec votre profil) ;\n🍫 chocolat noir à forte teneur en cacao (au moins 85 %) ;\n🍓 quelques fruits rouges en petite quantité.","m4c4b"],
  ["🍯 Les édulcorants et 🍮 les idées gourmandes","Certaines recettes utilisent des édulcorants à la place du sucre. Ils peuvent être utiles pour la transition, mais il est préférable d'en limiter l'usage afin d'habituer progressivement votre palais à des saveurs moins sucrées.\nChaque personne réagit différemment : observez vos sensations et votre envie de sucre après leur consommation.\n\n🍮 Quelques desserts simples à intégrer occasionnellement :\n🍫 mousse au chocolat keto ;\n🧁 muffins aux amandes ;\n🍓 fromage blanc ou yaourt grec avec quelques fruits rouges ;\n🥥 crème coco à la vanille ;\n🧀 mini cheesecake sans sucre ajouté.\nCes recettes sont disponibles dans la rubrique Recettes de Keto-Essenciel.","m4c4c"],
  ["⚠️ Attention aux produits industriels","De nombreux produits affichent les mentions « Keto », « Low Carb » ou « Sans sucre ». Ces allégations ne garantissent pas une bonne qualité nutritionnelle.\nAvant d'acheter :\n✔ lisez la liste des ingrédients ;\n✔ vérifiez la quantité de glucides ;\n✔ évitez les produits contenant de nombreux additifs ou ingrédients difficiles à identifier.\nEn règle générale, un dessert maison reste souvent un meilleur choix.\n\n💡 Astuce Keto-Essenciel : si une envie de sucré apparaît, essayez d'abord un thé parfumé, une infusion ou un carré de chocolat noir riche en cacao. Il arrive qu'une simple envie de douceur disparaisse rapidement sans avoir besoin d'un véritable dessert.","m4c4d"],
  ["📝 À retenir","⚠️ Les erreurs fréquentes :\n❌ manger un dessert après chaque repas ;\n❌ penser qu'un dessert keto est « à volonté » ;\n❌ acheter uniquement des produits industriels ;\n❌ utiliser beaucoup d'édulcorants.\n\n📝 À retenir :\n✔ les desserts keto peuvent faire partie de votre alimentation, avec modération ;\n✔ les recettes maison sont généralement à privilégier ;\n✔ réduire progressivement le goût pour le sucré est un objectif bénéfique ;\n✔ le plaisir alimentaire passe aussi par la qualité des ingrédients et le partage d'un repas.\n\n🏅 Badge à débloquer en validant le quiz : « Je me fais plaisir avec équilibre »"]],
  q:[["Peut-on manger un dessert en alimentation cétogène ?",["Non, jamais","Oui, de manière occasionnelle et adaptée"],1,"Le plaisir reste possible : recettes adaptées, consommées avec modération."],
     ["Quel chocolat est généralement le plus adapté ?",["Chocolat au lait","Chocolat noir à forte teneur en cacao"],1,"Un chocolat à au moins 85 % de cacao contient très peu de sucre."],
     ["Les desserts keto sont-ils à consommer sans limite ?",["Oui","Non"],1,"Même keto, un dessert reste un plaisir ponctuel — pas une nécessité quotidienne."],
     ["Quel est souvent le meilleur choix ?",["Un dessert maison","Un produit industriel « keto »"],0,"Le fait maison garantit des ingrédients simples, sans additifs cachés."],
     ["Pourquoi limiter les édulcorants ?",["Pour habituer progressivement son palais à des saveurs moins sucrées","Parce qu'ils remplacent les protéines"],0,"Réduire le goût sucré aide à se libérer durablement des envies de sucre."]]},
 {t:"Le Batch Cooking : cuisiner une fois, manger plusieurs fois",mi:"Planifiez votre prochaine session de batch cooking. Choisissez : ✅ 2 sources de protéines, ✅ 3 légumes, ✅ 1 sauce maison. Préparez ces éléments pour composer plusieurs repas dans la semaine.",p:[
  ["👋 Introduction","Vous manquez de temps pour cuisiner tous les jours ?\nLe batch cooking consiste à préparer plusieurs repas en une seule session de cuisine. En quelques heures, vous pouvez organiser une grande partie de vos repas de la semaine.\nCette méthode permet de gagner du temps, de réduire le stress et d'éviter les repas improvisés, souvent moins équilibrés.\n\n⏱ Temps de lecture : 5 minutes.\n\n🎯 À la fin de ce chapitre, vous serez capable de :\n✅ comprendre le principe du batch cooking ;\n✅ organiser vos repas de la semaine ;\n✅ gagner du temps en cuisine ;\n✅ réduire le gaspillage alimentaire."],
  ["🍽️ Qu'est-ce que le batch cooking ?","Le batch cooking consiste à préparer à l'avance plusieurs ingrédients ou plusieurs plats.\nPar exemple :\n• cuire plusieurs portions de poulet ;\n• préparer une grande quantité de légumes rôtis ;\n• cuire des œufs durs ;\n• préparer une vinaigrette maison.\nCes préparations pourront ensuite être combinées de différentes façons au cours de la semaine.\n\n🗓️ Comment s'organiser ? Choisissez un moment calme dans la semaine, par exemple le dimanche après-midi. Avant de commencer :\n✔ consultez vos menus Keto-Essenciel ;\n✔ faites votre liste de courses ;\n✔ préparez votre plan de travail ;\n✔ sortez les boîtes de conservation.\nUne bonne préparation permet de cuisiner plus sereinement.","m4c5b"],
  ["🥩 Les aliments qui se prêtent bien au batch cooking","Protéines : 🐔 blanc de poulet, 🥩 bœuf, 🐟 saumon, 🥚 œufs durs, 🧆 boulettes maison.\n\nLégumes : 🥦 brocoli, chou-fleur, 🥒 courgettes, 🫑 poivrons, 🍄 champignons. Ces légumes se conservent généralement bien quelques jours au réfrigérateur lorsqu'ils sont cuits.\n\nAccompagnements : 🥗 salades lavées et prêtes à servir, 🥑 avocats (à préparer au dernier moment), 🫒 olives, 🧀 fromages.","m4c5c"],
  ["❄️ Bien conserver ses préparations","Pour préserver la qualité et la sécurité des aliments :\n✔ réfrigérez rapidement les plats cuisinés ;\n✔ utilisez des boîtes hermétiques ;\n✔ indiquez la date de préparation si vous cuisinez pour plusieurs jours ;\n✔ respectez les règles habituelles de conservation et de réchauffage.\nVous pouvez également congeler certaines préparations en portions individuelles.\n\n💡 Les avantages du batch cooking :\n⏱ gagner du temps ;\n💰 réduire le gaspillage alimentaire ;\n🛒 faire des courses plus efficaces ;\n😌 limiter le stress des repas ;\n🥗 respecter plus facilement vos objectifs nutritionnels.","m4c5d"],
  ["📝 À retenir","⚠️ Les erreurs fréquentes :\n❌ préparer des quantités trop importantes ;\n❌ cuisiner toujours les mêmes recettes ;\n❌ oublier d'étiqueter les préparations ;\n❌ négliger les règles de conservation.\n\n💡 Astuce Keto-Essenciel : commencez simplement. Inutile de préparer toute votre semaine dès le début. Essayez d'abord de cuisiner 2 ou 3 repas à l'avance ; une fois cette habitude installée, augmentez progressivement selon votre emploi du temps.\n\n📝 À retenir :\n✔ le batch cooking permet de gagner du temps ;\n✔ une bonne organisation facilite le maintien de vos habitudes alimentaires ;\n✔ préparer quelques repas à l'avance aide à éviter les choix de dernière minute ;\n✔ il est préférable de commencer progressivement.\n\n🏅 Badge à débloquer en validant le quiz : « J'organise ma semaine »"]],
  q:[["Quel est le principal objectif du batch cooking ?",["Cuisiner tous les jours","Préparer plusieurs repas à l'avance"],1,"Une session de cuisine = plusieurs repas prêts pour la semaine."],
     ["Quel est un avantage du batch cooking ?",["Gagner du temps, réduire le gaspillage et faciliter son programme alimentaire","Manger plus de glucides","Cuisiner plus souvent"],0,"Temps, budget, sérénité et régularité : tous les bénéfices à la fois."],
     ["Quel équipement est utile ?",["Des boîtes hermétiques et un réfrigérateur","Une machine à pain","Aucun équipement"],0,"Boîtes hermétiques + réfrigérateur (et congélateur) : le duo indispensable."],
     ["Faut-il commencer par préparer toute la semaine ?",["Oui","Non, il est préférable de commencer progressivement"],1,"2 ou 3 repas d'avance suffisent pour installer l'habitude en douceur."],
     ["Peut-on congeler certaines préparations ?",["Non","Oui, lorsque cela est adapté à l'aliment préparé"],1,"La congélation en portions individuelles est une excellente alliée du batch cooking."]]},
 {t:"Manger keto avec un petit budget",mi:"Préparez votre prochaine liste de courses. Essayez d'y intégrer : 🥚 une source de protéines économique, 🥦 deux légumes de saison, 🐟 une conserve de poisson, 🧀 un produit laitier adapté à votre alimentation. Comparez ensuite votre budget avec celui de vos habitudes précédentes.",p:[
  ["👋 Introduction","L'alimentation cétogène est parfois perçue comme coûteuse. Pourtant, ce n'est pas une obligation.\nEn privilégiant des aliments simples, peu transformés et en planifiant vos repas, il est possible de manger keto sans faire exploser son budget.\nLe plus important est de privilégier la qualité des aliments plutôt que les produits « keto » industriels.\n\n⏱ Temps de lecture : 5 minutes.\n\n🎯 À la fin de ce chapitre, vous serez capable de :\n✅ faire des courses plus économiques ;\n✅ choisir des aliments offrant un bon rapport qualité-prix ;\n✅ réduire le gaspillage alimentaire ;\n✅ éviter les dépenses inutiles."],
  ["🛒 Privilégiez les aliments bruts","Les aliments les plus simples sont souvent les plus intéressants.\nQuelques exemples :\n🥚 œufs ;\n🐔 cuisses de poulet ;\n🥩 viande hachée ;\n🐟 sardines et maquereaux en conserve ;\n🧀 fromage ;\n🥦 légumes de saison ;\n🥬 légumes surgelés nature.\nCes aliments permettent de préparer de nombreux repas à moindre coût.\n\n🥦 Achetez de saison — les fruits et légumes de saison sont généralement :\n✔ moins chers ;\n✔ plus savoureux ;\n✔ plus faciles à trouver.\nLorsque ce n'est pas possible, les légumes surgelés nature constituent une excellente alternative.","m4c6b"],
  ["📦 Achetez intelligemment","Quelques habitudes peuvent faire la différence :\n✔ préparer une liste de courses ;\n✔ comparer les prix au kilo ;\n✔ acheter certains produits en plus grande quantité lorsqu'ils sont en promotion ;\n✔ congeler les portions non utilisées.\n\n🍽️ Cuisinez davantage — les plats préparés sont souvent plus coûteux et parfois plus riches en ingrédients peu intéressants sur le plan nutritionnel. Préparer ses repas permet généralement :\n💰 de faire des économies ;\n🥗 de mieux contrôler les ingrédients utilisés ;\n🍴 d'adapter les portions à ses besoins.","m4c6c"],
  ["🚫 Méfiez-vous du marketing","De nombreux produits affichent des mentions comme « Keto », « Low Carb » ou « Sans sucre ». Ces produits sont souvent plus chers sans être forcément meilleurs.\nAvant d'acheter, posez-vous une question simple : puis-je préparer une version maison plus simple et moins coûteuse ?\nLa réponse est souvent oui.\n\n💡 Astuce Keto-Essenciel : organisez vos menus avant de faire vos courses. En sachant exactement ce que vous allez cuisiner, vous achetez uniquement ce dont vous avez besoin et limitez les achats impulsifs.","m4c6d"],
  ["📝 À retenir","⚠️ Les erreurs fréquentes :\n❌ acheter de nombreux produits spécialisés ;\n❌ faire ses courses sans liste ;\n❌ jeter des aliments non consommés ;\n❌ oublier les promotions sur les produits de base.\n\n📝 À retenir :\n✔ manger keto ne signifie pas dépenser davantage ;\n✔ les aliments simples sont souvent les meilleurs choix ;\n✔ une bonne organisation permet de réduire les dépenses ;\n✔ le fait maison est souvent plus économique que les produits industriels.\n\n🏅 Badge à débloquer en validant le quiz : « Je mange mieux sans dépenser plus »"]],
  q:[["Manger keto est-il forcément plus cher ?",["Oui","Non, avec une bonne organisation il est possible de maîtriser son budget"],1,"Aliments bruts + planification = un budget keto parfaitement maîtrisé."],
     ["Quel aliment offre souvent un excellent rapport qualité-prix ?",["Œufs, sardines en conserve et cuisses de poulet","Barres « keto » importées","Plats préparés"],0,"Œufs, conserves de poisson et cuisses de poulet : des protéines de qualité à petit prix."],
     ["Pourquoi acheter des légumes de saison ?",["Ils sont souvent moins chers et plus savoureux","Ils contiennent plus de sucre"],0,"De saison = moins chers, plus savoureux, plus faciles à trouver."],
     ["Quel est le meilleur moyen d'éviter les achats inutiles ?",["Faire ses courses sans préparation","Préparer une liste de courses"],1,"La liste de courses, issue de vos menus, limite les achats impulsifs."],
     ["Les produits portant la mention « keto » sont-ils toujours le meilleur choix ?",["Oui","Non, il est préférable de lire les ingrédients et de comparer avec des aliments bruts"],1,"Souvent plus chers sans être meilleurs : la version maison gagne presque toujours."]]},
 {t:"Manger au restaurant, en vacances ou chez des proches",mi:"Pensez à votre prochaine sortie. Choisissez à l'avance : 🍽️ un plat principal, 🥗 un accompagnement, 🥤 une boisson. En préparant votre choix, vous gagnerez en sérénité le moment venu.",p:[
  ["👋 Introduction","Suivre une alimentation cétogène ne signifie pas renoncer aux sorties, aux repas de famille ou aux vacances.\nL'objectif n'est pas d'être parfait à chaque repas, mais de faire des choix adaptés dans la plupart des situations.\nAvec un peu d'anticipation, il est tout à fait possible de profiter de ces moments tout en restant fidèle à vos objectifs.\n\n⏱ Temps de lecture : 5 minutes.\n\n🎯 À la fin de ce chapitre, vous serez capable de :\n✅ choisir des plats adaptés au restaurant ;\n✅ gérer un repas de famille sans stress ;\n✅ faire de bons choix pendant vos vacances ;\n✅ reprendre facilement vos habitudes après un écart."],
  ["🍽️ Au restaurant et 🎉 en famille","La plupart des restaurants proposent des options compatibles avec une alimentation cétogène. Privilégiez :\n🥩 viandes grillées ;\n🐟 poissons ;\n🍗 volailles ;\n🥗 salades composées ;\n🥦 légumes en accompagnement.\nN'hésitez pas à demander quelques adaptations, par exemple remplacer les frites ou le riz par une portion de légumes ou une salade.\n\n🎉 Lors d'un repas de famille — les repas conviviaux sont avant tout des moments de partage. Inutile d'attirer l'attention sur votre alimentation. Composez simplement votre assiette avec les aliments qui vous conviennent le mieux : ✔ protéines, ✔ légumes, ✔ bonnes matières grasses lorsque c'est possible.\nSi un dessert vous est proposé, rappelez-vous qu'un repas ne définit pas votre réussite.","m4c7b"],
  ["✈️ En vacances et 🚗 en déplacement","Les vacances sont faites pour se détendre. Quelques conseils simples :\n✔ hydratez-vous suffisamment ;\n✔ continuez à privilégier les aliments peu transformés ;\n✔ marchez dès que vous en avez l'occasion ;\n✔ profitez des spécialités locales tout en restant raisonnable sur les portions.\nL'objectif est de préserver un équilibre global, pas de rechercher la perfection.\n\n🚗 En déplacement, pensez à emporter quelques aliments faciles à transporter :\n🥚 œufs durs ;\n🧀 portions de fromage ;\n🫒 olives ;\n🥒 bâtonnets de légumes ;\n🐟 sardines ou maquereaux en conserve (si les conditions de transport le permettent).\nIls peuvent dépanner lors de longs trajets.","m4c7c"],
  ["💬 Si l'on vous pose des questions…","Il n'est pas nécessaire de vous justifier. Vous pouvez simplement répondre :\n« J'essaie de manger de façon plus adaptée à mes besoins. »\nLa plupart des personnes respecteront votre choix.\n\n💡 Astuce Keto-Essenciel : avant de sortir au restaurant, consultez le menu en ligne si celui-ci est disponible. Vous pourrez choisir votre plat à l'avance et éviter les décisions prises dans la précipitation.","m4c7d"],
  ["📝 À retenir","⚠️ Les erreurs fréquentes :\n❌ penser qu'un seul repas « gâche tout » ;\n❌ se priver complètement pour compenser un écart ;\n❌ abandonner son programme après une sortie ;\n❌ se sentir coupable.\n\n📝 À retenir :\n✔ vous pouvez continuer à profiter des repas conviviaux ;\n✔ faites simplement les meilleurs choix possibles ;\n✔ un écart ponctuel ne remet pas en cause vos progrès ;\n✔ reprenez vos habitudes dès le repas suivant.\n\n🏅 Badge à débloquer en validant le quiz : « Je reste serein en toutes circonstances »"]],
  q:[["Peut-on manger au restaurant en suivant une alimentation cétogène ?",["Non","Oui, en choisissant des plats adaptés"],1,"Viandes grillées, poissons, salades : les options compatibles ne manquent pas."],
     ["Quel accompagnement est généralement préférable ?",["Frites","Salade ou légumes"],1,"Demandez simplement à remplacer frites ou riz par des légumes ou une salade."],
     ["Que faire après un repas plus riche que prévu ?",["Arrêter son programme","Reprendre ses habitudes dès le repas suivant"],1,"Un écart ponctuel ne remet pas en cause vos progrès : on reprend, sans culpabilité."],
     ["Est-il nécessaire de se justifier auprès de ses proches ?",["Oui","Non"],1,"« J'essaie de manger de façon plus adaptée à mes besoins » suffit largement."],
     ["Quelle est la meilleure attitude pendant les vacances ?",["Chercher la perfection","Profiter tout en gardant un bon équilibre"],1,"L'équilibre global compte plus que la perfection de chaque repas."]]},
 {t:"Les erreurs les plus fréquentes… et comment les éviter",mi:"Prenez quelques minutes pour réfléchir à votre parcours. Parmi les erreurs présentées, laquelle vous concerne le plus aujourd'hui ? Choisissez une seule habitude que vous souhaitez améliorer cette semaine et notez votre objectif dans votre journal de suivi.",p:[
  ["👋 Introduction","Il est normal de faire des erreurs lorsque l'on change ses habitudes alimentaires. Personne ne réussit parfaitement dès le premier jour.\nL'important n'est pas d'être parfait, mais d'apprendre à identifier les difficultés pour progresser durablement.\n\n⏱ Temps de lecture : 5 minutes.\n\n🎯 À la fin de ce chapitre, vous serez capable de :\n✅ reconnaître les erreurs les plus fréquentes ;\n✅ comprendre leurs conséquences ;\n✅ mettre en place des solutions simples pour les éviter."],
  ["❌ Erreurs n°1 et 2","❌ Erreur n°1 : vouloir aller trop vite. Certaines personnes réduisent brutalement tous les glucides dès le premier jour. Même si cela peut convenir à certains, une transition progressive est parfois plus facile à vivre.\n💡 Le conseil : avancez à votre rythme et concentrez-vous sur des changements durables.\n\n❌ Erreur n°2 : ne pas manger assez de protéines. Les protéines jouent un rôle essentiel dans le maintien de la masse musculaire et la satiété. Un apport insuffisant peut favoriser la fatigue et la faim entre les repas.\n💡 Le conseil : prévoyez une source de protéines à chaque repas.","m4c8b"],
  ["❌ Erreurs n°3 et 4","❌ Erreur n°3 : oublier les légumes. Par peur des glucides, certaines personnes réduisent fortement leur consommation de légumes. Pourtant, les légumes pauvres en glucides apportent des fibres, des vitamines et des minéraux essentiels.\n💡 Le conseil : ajoutez une belle portion de légumes à vos repas.\n\n❌ Erreur n°4 : manger trop de produits industriels « keto ». Barres, biscuits, pains ou desserts « keto » peuvent sembler pratiques. Cependant, ils sont souvent coûteux et parfois très transformés.\n💡 Le conseil : privilégiez les aliments bruts et les préparations maison.","m4c8c"],
  ["❌ Erreurs n°5 et 6","❌ Erreur n°5 : négliger l'hydratation. Au début d'une alimentation cétogène, les besoins en eau peuvent évoluer. Une hydratation insuffisante peut contribuer à la fatigue ou aux maux de tête.\n💡 Le conseil : buvez régulièrement tout au long de la journée et suivez les recommandations de votre professionnel de santé concernant les électrolytes.\n\n❌ Erreur n°6 : se décourager après un écart. Un repas plus riche que prévu ne remet pas en cause tous vos efforts. Ce qui compte, c'est ce que vous faites ensuite.\n💡 Le conseil : reprenez simplement vos bonnes habitudes au repas suivant.","m4c8d"],
  ["📝 À retenir","💡 Astuce Keto-Essenciel : ne cherchez pas la perfection, cherchez la régularité. De petits progrès répétés chaque semaine sont souvent plus efficaces qu'un changement radical difficile à maintenir.\n\n⚠️ Les pièges à éviter :\n❌ se comparer aux autres ;\n❌ vouloir perdre du poids trop rapidement ;\n❌ supprimer totalement le plaisir de manger ;\n❌ oublier que chaque personne progresse à son rythme.\n\n📝 À retenir :\n✔ les erreurs font partie de l'apprentissage ;\n✔ les aliments simples restent les meilleurs alliés ;\n✔ la régularité est plus importante que la perfection ;\n✔ chaque repas est une nouvelle occasion de faire un bon choix.\n\n🏅 Badge à débloquer en validant le quiz : « Je progresse avec confiance »"]],
  q:[["Quelle est une erreur fréquente au début d'une alimentation keto ?",["Vouloir changer trop de choses d'un seul coup","Prévoir ses repas"],0,"Une transition progressive et des changements durables valent mieux qu'un virage brutal."],
     ["Pourquoi les protéines sont-elles importantes ?",["Elles favorisent la satiété et contribuent au maintien de la masse musculaire","Elles remplacent les légumes"],0,"Une source de protéines à chaque repas : satiété + muscles préservés."],
     ["Les légumes pauvres en glucides doivent-ils être supprimés ?",["Oui","Non"],1,"Fibres, vitamines, minéraux : les légumes pauvres en glucides sont indispensables."],
     ["Que faire après un écart alimentaire ?",["Tout arrêter","Reprendre ses habitudes dès le repas suivant"],1,"Ce qui compte, c'est ce que vous faites ensuite — pas l'écart lui-même."],
     ["Quelle qualité est la plus importante pour réussir ?",["La perfection","La régularité"],1,"De petits progrès répétés battent toujours un changement radical intenable."]]}
]},
{t:"Perte de poids",e:"⚖️",d:"Comprendre son corps pour mincir durablement.",ch:[
 {t:"Pourquoi on grossit ?",p:[
  ["L'insuline, hormone du stockage","On ne grossit pas seulement parce qu'on « mange trop » : on grossit parce que le corps stocke.\nEt le chef d'orchestre du stockage, c'est l'insuline. Tant qu'elle est élevée (repas glucidiques répétés, grignotage), le corps stocke et ne déstocke pas — même en mangeant « peu ».\nRéduire les glucides fait baisser l'insuline : le corps peut enfin puiser dans ses réserves."],
  ["Le cercle vicieux sucre-fringale","Repas sucré → pic de glycémie → pic d'insuline → chute de glycémie → fringale → nouveau repas sucré…\nCe manège épuise le pancréas et fait grossir. Le keto casse ce cercle : glycémie plate = plus de fringales = contrôle naturel de l'appétit, sans volonté surhumaine."]],
  q:[["Quelle hormone commande le stockage des graisses ?",["L'insuline","La mélatonine","L'adrénaline"],0,"Tant que l'insuline est haute, le corps stocke et ne déstocke pas."],
     ["Comment le keto casse-t-il le cercle des fringales ?",["En stabilisant la glycémie","En interdisant de manger","Par magie"],0,"Glycémie plate = plus de pics ni de chutes = plus de fringales."]]},
 {t:"La graisse viscérale",p:[
  ["L'ennemie invisible","Il existe deux graisses : la sous-cutanée (sous la peau, peu dangereuse) et la viscérale (autour des organes, dans le ventre).\nLa graisse viscérale est métaboliquement active : elle libère des substances inflammatoires qui aggravent la résistance à l'insuline. C'est elle qui fait le lit du diabète de type 2.\nBonne nouvelle : c'est aussi la première à fondre en keto."],
  ["Le tour de taille, votre meilleur indicateur","Mieux que la balance : le mètre ruban.\nRepères de risque : plus de 94 cm chez l'homme, plus de 80 cm chez la femme.\nMesurez votre tour de taille chaque semaine (au niveau du nombril, ventre relâché) et notez-le dans l'onglet Suivi. Le voir diminuer = la graisse viscérale fond = votre diabète s'améliore."]],
  q:[["Quelle graisse aggrave le plus la résistance à l'insuline ?",["La graisse sous-cutanée","La graisse viscérale (autour des organes)","La graisse des cuisses"],1,"La graisse viscérale libère des substances inflammatoires qui aggravent le diabète."],
     ["Quel outil suit le mieux la graisse viscérale ?",["Le mètre ruban (tour de taille)","Le thermomètre","Le miroir uniquement"],0,"Le tour de taille est le meilleur reflet de la graisse abdominale profonde."]]},
 {t:"Les plateaux",p:[
  ["Le plateau est normal","Après quelques semaines de perte, la balance se fige : c'est le plateau. C'est un phénomène normal — le corps s'adapte, se recompose (muscle +, graisse −), retient parfois de l'eau.\nUn plateau n'est PAS un échec : si le tour de taille diminue ou si les vêtements flottent, vous progressez encore."],
  ["Les leviers anti-plateau","Si le plateau dure plus de 3-4 semaines :\n• Traquez les glucides cachés (sauces, « produits keto » industriels).\n• Réduisez les excès de produits laitiers et d'oléagineux (faciles à surconsommer).\n• Espacez les repas (2 repas/jour, pas de grignotage).\n• Bougez plus : marche quotidienne + renforcement musculaire.\n• Dormez ! Le manque de sommeil bloque la perte de poids."]],
